<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cardiovascular Pathology Revision Hub</title>
<style>
  :root{
    --bg:#f4f6fa; --card-bg:#ffffff; --text:#222831; --muted:#5b6472;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI', Roboto, Arial, sans-serif;
    background:var(--bg); color:var(--text); font-size:16px; line-height:1.5;
    -webkit-tap-highlight-color: transparent;
  }
  header{
    background:linear-gradient(135deg,#8e0e00,#1f1c18);
    color:#fff; padding:22px 16px; text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
  }
  header h1{margin:0; font-size:1.5rem;}
  header p{margin:6px 0 0; font-size:0.95rem; opacity:0.9;}
  .wrap{max-width:900px; margin:0 auto; padding:16px;}
  .home-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:14px; margin-top:16px;
  }
  .topic-card{
    background:var(--card-bg); border-left:8px solid var(--tc);
    border-radius:10px; padding:16px; cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,0.08); transition:transform .15s;
    min-height:90px; display:flex; flex-direction:column; justify-content:center;
  }
  .topic-card:active{transform:scale(0.97);}
  .topic-card h3{margin:0 0 6px; font-size:1.05rem; color:var(--tc);}
  .topic-card .badge{
    font-size:0.85rem; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap;
  }
  .topic-card .score-pill{
    background:var(--tc); color:#fff; padding:2px 10px; border-radius:12px; font-size:0.8rem;
  }
  .topbar{
    display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;
  }
  .btn{
    border:none; border-radius:8px; padding:10px 16px; font-size:0.95rem;
    cursor:pointer; font-weight:600;
  }
  .btn-back{background:#e4e7ec; color:#333;}
  .btn-primary{background:var(--tc); color:#fff;}
  .btn-outline{background:#fff; border:2px solid var(--tc); color:var(--tc);}
  .tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .tab{
    padding:9px 14px; border-radius:20px; background:#fff; border:2px solid var(--tc);
    color:var(--tc); font-weight:600; cursor:pointer; font-size:0.9rem;
  }
  .tab.active{background:var(--tc); color:#fff;}
  .topic-title{border-left:8px solid var(--tc); padding-left:12px; margin:8px 0 18px;}
  .topic-title h2{margin:0; color:var(--tc); font-size:1.3rem;}

  /* Facts */
  .facts-list{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px;}
  .facts-list li{
    background:#fff; border-left:6px solid var(--tc); border-radius:8px;
    padding:12px 14px; box-shadow:0 1px 4px rgba(0,0,0,0.06); font-size:0.98rem;
  }

  /* Flashcards */
  .flash-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px;}
  .flip-card{background:transparent; perspective:1000px; height:150px; cursor:pointer;}
  .flip-inner{
    position:relative; width:100%; height:100%; text-align:center;
    transition:transform .5s; transform-style:preserve-3d;
  }
  .flip-card.flipped .flip-inner{transform:rotateY(180deg);}
  .flip-front,.flip-back{
    position:absolute; width:100%; height:100%; -webkit-backface-visibility:hidden;
    backface-visibility:hidden; border-radius:10px; padding:14px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,0.1); font-size:0.95rem; overflow:auto;
  }
  .flip-front{background:#fff; border:2px solid var(--tc); color:var(--text); font-weight:600;}
  .flip-back{background:var(--tc); color:#fff; transform:rotateY(180deg);}
  .flip-hint{font-size:0.75rem; color:var(--muted); text-align:center; margin-top:6px;}

  /* Quiz */
  .quiz-box{background:#fff; border-radius:10px; padding:18px; border:2px solid var(--tc); box-shadow:0 2px 6px rgba(0,0,0,0.08);}
  .quiz-progress{font-size:0.85rem; color:var(--muted); margin-bottom:8px;}
  .quiz-q{font-size:1.02rem; font-weight:600; margin-bottom:14px;}
  .option{
    display:block; width:100%; text-align:left; background:#f7f8fa; border:2px solid #dfe3e8;
    border-radius:8px; padding:12px 14px; margin-bottom:10px; font-size:0.95rem; cursor:pointer;
  }
  .option.correct{background:#e3f7e8; border-color:#2e8b45; color:#1e5c2c; font-weight:600;}
  .option.incorrect{background:#fbe6e6; border-color:#c0392b; color:#8a2418; font-weight:600;}
  .option:disabled{cursor:default;}
  .explain{
    margin-top:10px; padding:12px; background:#fff8e6; border-left:5px solid #e0a500;
    border-radius:6px; font-size:0.9rem; display:none;
  }
  .quiz-nav{display:flex; justify-content:space-between; margin-top:16px;}
  .result-box{text-align:center; padding:20px;}
  .result-box .big-score{font-size:2.2rem; font-weight:700; color:var(--tc); margin:10px 0;}
  footer{text-align:center; padding:20px; color:var(--muted); font-size:0.8rem;}
  @media (max-width:480px){
    header h1{font-size:1.25rem;}
    .flip-card{height:170px;}
  }
</style>
</head>

let state = { view:'home', topicId:null, tab:'facts', quizIndex:0, quizScore:0, answered:[] };

function getScore(id){
  const raw = localStorage.getItem('cvhub_score_'+id);
  return raw ? JSON.parse(raw) : null;
}
function saveScore(id, score, total){
  localStorage.setItem('cvhub_score_'+id, JSON.stringify({score, total}));
}

function render(){
  const app = document.getElementById('app');
  if(state.view === 'home'){
    app.innerHTML = renderHome();
    document.querySelectorAll('.topic-card').forEach(el=>{
      el.addEventListener('click', ()=>{
        state.view='topic'; state.topicId=el.dataset.id; state.tab='facts';
        render();
      });
    });
  } else {
    const topic = topics.find(t=>t.id===state.topicId);
    app.innerHTML = renderTopic(topic);
    document.documentElement.style.setProperty('--tc', topic.color);
    document.getElementById('backBtn').addEventListener('click', ()=>{ state.view='home'; render(); });
    document.querySelectorAll('.tab').forEach(el=>{
      el.addEventListener('click', ()=>{
        state.tab = el.dataset.tab;
        if(state.tab==='quiz'){ state.quizIndex=0; state.quizScore=0; state.answered=[]; }
        render();
      });
    });
    if(state.tab==='flash'){
      document.querySelectorAll('.flip-card').forEach(el=>{
        el.addEventListener('click', ()=> el.classList.toggle('flipped'));
      });
    }
    if(state.tab==='quiz'){
      bindQuizEvents(topic);
    }
  }
}

function renderHome(){
  let cards = topics.map(t=>{
    const sc = getScore(t.id);
    const pill = sc ? `<span class="score-pill">Quiz: ${sc.score}/${sc.total}</span>` : `<span class="score-pill" style="opacity:0.6;">Quiz: not attempted</span>`;
    return `<div class="topic-card" data-id="${t.id}" style="--tc:${t.color}">
      <h3>${t.name}</h3>
      <div class="badge">${pill}</div>
    </div>`;
  }).join('');
  return `<div class="home-grid">${cards}</div>`;
}

function renderTopic(topic){
  let tabsHtml = `
    <div class="tabs">
      <div class="tab ${state.tab==='facts'?'active':''}" data-tab="facts">Key Facts</div>
      <div class="tab ${state.tab==='flash'?'active':''}" data-tab="flash">Flashcards</div>
      <div class="tab ${state.tab==='quiz'?'active':''}" data-tab="quiz">Quiz (5 Qs)</div>
    </div>
  `;
  let content = '';
  if(state.tab==='facts'){
    content = `<ul class="facts-list">${topic.facts.map(f=>`<li>${f}</li>`).join('')}</ul>`;
  } else if(state.tab==='flash'){
    content = `<div class="flash-grid">${topic.flash.map((c,i)=>`
      <div class="flip-card" data-i="${i}">
        <div class="flip-inner">
          <div class="flip-front">${c.f}</div>
          <div class="flip-back">${c.b}</div>
        </div>
      </div>`).join('')}</div>
      <p class="flip-hint">Tap a card to reveal the answer</p>`;
  } else if(state.tab==='quiz'){
    content = renderQuiz(topic);
  }
  return `
    <div class="topbar">
      <button class="btn btn-back" id="backBtn">&larr; Back to topics</button>
    </div>
    <div class="topic-title" style="border-color:${topic.color}"><h2 style="color:${topic.color}">${topic.name}</h2></div>
    ${tabsHtml}
    ${content}
  `;
}

function renderQuiz(topic){
  if(state.quizIndex >= topic.quiz.length){
    saveScore(topic.id, state.quizScore, topic.quiz.length);
    return `
      <div class="quiz-box">
        <div class="result-box">
          <div>Quiz complete!</div>
          <div class="big-score">${state.quizScore} / ${topic.quiz.length}</div>
          <button class="btn btn-primary" id="retryBtn">Retry Quiz</button>
        </div>
      </div>
    `;
  }
  const q = topic.quiz[state.quizIndex];
  const answeredThis = state.answered[state.quizIndex];
  let optsHtml = q.o.map((opt,i)=>{
    let cls = 'option';
    if(answeredThis !== undefined){
      if(i===q.a) cls += ' correct';
      else if(i===answeredThis && answeredThis!==q.a) cls += ' incorrect';
    }
    return `<button class="${cls}" data-i="${i}" ${answeredThis!==undefined?'disabled':''}>${String.fromCharCode(65+i)}. ${opt}</button>`;
  }).join('');
  return `
    <div class="quiz-box">
      <div class="quiz-progress">Question ${state.quizIndex+1} of ${topic.quiz.length} &middot; Score: ${state.quizScore}</div>
      <div class="quiz-q">${q.q}</div>
      <div class="options">${optsHtml}</div>
      <div class="explain" id="explainBox" style="${answeredThis!==undefined?'display:block;':''}"><strong>Explanation:</strong> ${q.e}</div>
      <div class="quiz-nav">
        <span></span>
        <button class="btn btn-primary" id="nextBtn" ${answeredThis===undefined?'style="display:none;"':''}>
          ${state.quizIndex===topic.quiz.length-1 ? 'See Result' : 'Next Question'}
        </button>
      </div>
    </div>
  `;
}

function bindQuizEvents(topic){
  const retryBtn = document.getElementById('retryBtn');
  if(retryBtn){
    retryBtn.addEventListener('click', ()=>{
      state.quizIndex=0; state.quizScore=0; state.answered=[]; render();
    });
    return;
  }
  document.querySelectorAll('.option').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.dataset.i);
      const q = topic.quiz[state.quizIndex];
      if(state.answered[state.quizIndex] !== undefined) return;
      state.answered[state.quizIndex] = i;
      if(i === q.a) state.quizScore++;
      render();
    });
  });
  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn){
    nextBtn.addEventListener('click', ()=>{
      state.quizIndex++;
      render();
    });
  }
}

render();
</script>
