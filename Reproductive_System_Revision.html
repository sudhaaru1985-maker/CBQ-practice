 ex:"Fetal parts alongside molar (grapelike) villi indicate a <b>partial hydatidiform mole</b>, which is typically <b>triploid</b> (69,XXY/XXX) from fertilisation of one egg by two sperm — unlike the diploid, fetus-free complete mole."},
{q:"An 8-year-old girl has precocious puberty and an ovarian mass. Microscopy shows tumor cells arranged in cords, some with nuclear grooves. Most likely diagnosis?",
 opts:["Mature cystic teratoma","Granulosa cell tumor","Sertoli cell tumor","Dysgerminoma","Serous cystadenoma"], ans:1,
 ex:"<b>Granulosa cell tumours</b> secrete oestrogen, causing precocious puberty in children or abnormal bleeding in adults. Nuclear grooves ('coffee-bean' nuclei) and Call-Exner bodies are diagnostic clues."},
{q:"A 38-year-old female has a cystic ovarian tumour of serous origin. Which feature is necessary for a diagnosis of serous cystadenocarcinoma (versus a borderline tumour)?",
 opts:["Papillary structures","Immature neuroepithelium","Psammoma bodies","Invasion of stroma","Presence of ascites"], ans:3,
 ex:"Papillary architecture and psammoma bodies can be seen in both borderline and malignant serous tumours. <b>Stromal invasion</b> is what separates frank serous cystadenocarcinoma from a borderline serous tumour."},
{q:"A 43-year-old woman's ovarian mass is unilocular, filled with watery fluid, and lined with papillary excrescences, with NO infiltration of the underlying stroma. Most likely diagnosis?",
 opts:["Granulosa-theca cell tumors","Mature cystic teratomas","Fibrosarcoma with metastases","Borderline serous tumor"], ans:3,
 ex:"Papillary architecture <b>without</b> stromal invasion defines a <b>borderline (low malignant potential) serous tumour</b> — intermediate between benign cystadenoma and frankly invasive cystadenocarcinoma."},
{q:"A 30-year-old woman has a multilocular ovarian tumor with thick viscous fluid, lined by mucinous columnar cells with no atypia, no papillae, and no stromal invasion. Appropriate diagnosis?",
 opts:["Endometrioid adenoma of ovary","Granulosa cell tumor","Mucinous cystadenocarcinoma","Mucinous cystadenoma","Serous cystadenocarcinoma"], ans:3,
 ex:"Bland, non-atypical mucin-secreting columnar epithelium without papillae or stromal invasion in a multilocular cystic mass = benign <b>mucinous cystadenoma</b>, which can grow very large."},
{q:"A 25-year-old woman with infertility, obesity (BMI 32), hirsutism, and always-irregular periods has symmetrically enlarged ovaries. Expected ovarian pathology?",
 opts:["Bilateral endometriomas","Cystic teratoma","Mucinous cystadenoma","Serous cystadenoma","Subcapsular cysts"], ans:4,
 ex:"Obesity, hirsutism, oligomenorrhoea, and infertility describe <b>PCOS</b>. Ovaries show multiple small <b>subcapsular</b> follicular cysts with a thickened capsule, driven by chronic anovulation and hyperandrogenism."},
{q:"A 14-year-old girl has abdominal pain and a pelvic mass. Biopsy shows sheets of large cells with clear cytoplasm and central nuclei, positive for PLAP and LDH. Most likely diagnosis?",
 opts:["Endodermal sinus tumor","Choriocarcinoma","Dysgerminoma","Teratoma"], ans:2,
 ex:"<b>Dysgerminoma</b> is the ovarian counterpart of testicular seminoma — sheets of uniform clear cells positive for PLAP and LDH, and highly radiosensitive."},
{q:"A 60-year-old postmenopausal woman has bilateral solid-cystic ovarian masses. Histopathology shows papillary structures with psammoma bodies. Most likely diagnosis?",
 opts:["Granulosa cell tumor","Serous cystadenocarcinoma","Dysgerminoma","Mucinous cystadenoma"], ans:1,
 ex:"Bilateral solid-cystic ovarian masses with papillary architecture and psammoma bodies in a postmenopausal woman are classic for <b>serous cystadenocarcinoma</b>, the most common malignant ovarian tumour."},
{q:"A 22-year-old woman has nausea and vaginal bleeding at 10 weeks' gestation. Uterus large-for-dates. Ultrasound shows a 'snowstorm' pattern with no fetus. β-hCG markedly elevated. Most likely diagnosis?",
 opts:["Incomplete abortion","Ectopic pregnancy","Partial hydatidiform mole","Complete hydatidiform mole"], ans:3,
 ex:"Absence of a fetus, a 'snowstorm' ultrasound pattern, uterus large-for-dates, and markedly elevated β-hCG are classic for a <b>complete hydatidiform mole</b> (diploid, entirely paternal in origin)."},
{q:"A 28-year-old woman with a history of molar pregnancy has haemoptysis and dyspnoea. CXR shows multiple cannonball metastases. β-hCG elevated; curettage shows no intrauterine pregnancy. Most likely diagnosis?",
 opts:["Invasive mole","Ectopic pregnancy","Endometrial carcinoma","Choriocarcinoma"], ans:3,
 ex:"<b>Choriocarcinoma</b> spreads early and widely via the bloodstream, classically producing 'cannonball' lung metastases. It is highly β-hCG-secreting yet very chemosensitive."},
{q:"A 32-year-old woman has irregular bleeding and breast tenderness. A solid ovarian mass shows Call-Exner bodies and inhibin positivity. Most likely diagnosis?",
 opts:["Sertoli-Leydig cell tumor","Dysgerminoma","Granulosa cell tumor","Fibroma"], ans:2,
 ex:"Call-Exner bodies (small follicle-like rosettes) and inhibin positivity are the hallmarks of <b>granulosa cell tumour</b>, an oestrogen-secreting sex cord-stromal tumour."},
{q:"A 24-year-old woman has a cystic ovarian mass with calcification and fat on ultrasound. Histology shows mature tissue from all three germ layers — skin, neural tissue, cartilage. Most likely diagnosis?",
 opts:["Serous cystadenoma","Mucinous cystadenoma","Mature cystic teratoma","Endometrioma"], ans:2,
 ex:"Mature tissue from all three germ layers in a cystic ovarian mass is a <b>mature cystic teratoma (dermoid cyst)</b> — the most common ovarian germ cell tumour, typically in young women."},
{q:"A 25-year-old woman after a spontaneous abortion has focal trophoblastic proliferation with some normal villi and fetal parts; β-hCG only mildly elevated. Most likely diagnosis?",
 opts:["Complete mole","Partial mole","Invasive mole","Choriocarcinoma"], ans:1,
 ex:"A mix of normal and hydropic villi plus identifiable fetal parts, with only mild β-hCG elevation, indicates a <b>partial (triploid) mole</b> — unlike the complete mole, which lacks fetal tissue and has much higher β-hCG."},
{q:"A 30-year-old woman, 6 months after a molar pregnancy, has persistent vaginal bleeding and rising β-hCG despite evacuation. Histology shows villi invading the myometrium. Most likely diagnosis?",
 opts:["Complete mole","Partial mole","Invasive mole","Choriocarcinoma"], ans:2,
 ex:"Persistent disease after mole evacuation with villi (still present, unlike choriocarcinoma) invading the myometrium defines an <b>invasive mole</b> — locally destructive but rarely metastasising widely."}
],
breast:[
{q:"A 47-year-old woman on routine mammographic screening has an excisional biopsy showing lobular carcinoma in situ (LCIS). Which finding is most likely associated?",
 opts:["No residual carcinoma","Opposite breast involvement","Absent family history of breast cancer","Concomitant Paget disease of the nipple","Negative estrogen receptor assay"], ans:1,
 ex:"<b>LCIS</b> is often multicentric and bilateral — best thought of as a marker of increased risk of invasive carcinoma in <b>either</b> breast, rather than a localized precursor."},
{q:"A 35-year-old woman has a firm, irregular breast mass with microcalcifications on mammography. Biopsy shows extensive fat necrosis. Most likely cause?",
 opts:["Pregnancy","Prolactinoma","Trauma","Fibrocystic changes","Mastitis"], ans:2,
 ex:"<b>Fat necrosis</b> is a benign inflammatory response to breast trauma (often unrecalled) — it clinically and mammographically mimics carcinoma, so biopsy is essential."},
{q:"A 39-year-old woman has a red, scaling area on her breast. Biopsy shows large cells at the dermal-epidermal junction staining positive for mucin. Most likely diagnosis?",
 opts:["Nipple discharge","Paget disease of breast","Intraductal carcinoma","Dermatophyte infection","Inflammatory carcinoma"], ans:1,
 ex:"Large, mucin-positive Paget cells within the nipple-areola epidermis define <b>Paget disease of the breast</b> — almost always associated with an underlying DCIS or invasive ductal carcinoma."},
{q:"A 55-year-old man has a solitary breast mass; biopsy shows malignant cells positive for HER2/neu and cytokeratins 4/11, negative for estrogen receptors. Most likely diagnosis?",
 opts:["Basal cell carcinoma","Invasive ductal carcinoma","Invasive lobular carcinoma","Medullary carcinoma","Tubular adenoma"], ans:1,
 ex:"Male breast cancer is overwhelmingly <b>invasive ductal carcinoma (NST)</b> — lobular carcinoma is rare in men, who lack normal lobular development."},
{q:"For the same patient above — which of the following is thought to play a role in the development of his cancer?",
 opts:["BRCA2 mutation","Chronic alcoholism","Gynecomastia","Hyperestrinism","PTEN mutation"], ans:0,
 ex:"<b>BRCA2</b> mutations carry a markedly increased lifetime risk of male breast cancer (more so than BRCA1) and should prompt genetic counselling and family screening."},
{q:"A 39-year-old woman has bloody nipple discharge for 5 weeks, no palpable mass, no skin lesions. Most likely diagnosis?",
 opts:["Mastitis","Intraductal papilloma","Trauma","Invasive breast carcinoma, NST","Tuberculosis"], ans:1,
 ex:"Unilateral bloody nipple discharge without a palpable mass is the classic presentation of <b>intraductal papilloma</b>, a benign papillary growth within a large duct."},
{q:"A 45-year-old woman has cyclical breast discomfort and lumpiness. Core biopsy shows epithelial hyperplasia with papillary projections and cystic change, no necrosis or calcifications. Diagnosis?",
 opts:["Non-proliferative fibrocystic change","Proliferative fibrocystic change","Atypical ductal hyperplasia","Ductal carcinoma in situ"], ans:1,
 ex:"Epithelial hyperplasia with papillary projections plus cystic change, without atypia or necrosis, is <b>proliferative fibrocystic change</b> — carrying a mild (1.5–2×) increase in future carcinoma risk."},
{q:"A 63-year-old woman has subtle mammographic architectural distortion. Core biopsy shows small uniform cells infiltrating in single-file patterns, with loss of cohesion and no tubule formation; E-cadherin is lost. Diagnosis?",
 opts:["Invasive ductal carcinoma","Invasive lobular carcinoma","Ductal carcinoma in situ","Tubular carcinoma"], ans:1,
 ex:"Single-file ('Indian-file') infiltration with loss of E-cadherin is the signature of <b>invasive lobular carcinoma</b> — notoriously subtle on mammography and often multicentric/bilateral."},
{q:"A 55-year-old woman's core biopsy for microcalcifications shows ducts filled with monotonous cells, central (comedo) necrosis, and a preserved basement membrane. This characterises?",
 opts:["Usual ductal hyperplasia","Atypical ductal hyperplasia","Ductal carcinoma in situ (DCIS)","Invasive ductal carcinoma"], ans:2,
 ex:"Malignant cells filling ducts with central necrosis but an <b>intact basement membrane</b> is comedo-type <b>DCIS</b> — a non-invasive precursor lesion that often produces microcalcifications on mammography."},
{q:"Which histological feature most reliably distinguishes a Phyllodes tumour from a fibroadenoma?",
 opts:["Presence of both epithelial and stromal components","Well-circumscribed margins","Leaf-like architecture and increased stromal cellularity","Absence of mitotic activity and atypia"], ans:2,
 ex:"Both are biphasic tumours, but <b>phyllodes tumour</b> is distinguished by its leaf-like papillary stromal projections and increased stromal cellularity — malignant potential depends on stromal mitoses/atypia."},
{q:"A 25-year-old woman has a well-defined, mobile breast mass. Microscopy shows bland stromal proliferation and compressed, regular ducts with no atypia or mitoses. Most likely diagnosis?",
 opts:["Benign phyllodes tumor","Fibroadenoma","Atypical ductal hyperplasia","Ductal carcinoma in-situ"], ans:1,
 ex:"A well-circumscribed, mobile ('breast mouse') mass in a young woman with bland biphasic proliferation is the classic <b>fibroadenoma</b> — the most common benign breast tumour in this age group."},
{q:"A 42-year-old woman has a rapidly growing, leaf-like breast lesion with increased stromal cellularity, mitoses >5/10 HPF, and infiltrative borders, with benign ductal epithelium. Most likely diagnosis?",
 opts:["Fibroadenoma","Invasive lobular carcinoma","Phyllodes tumor","Invasive ductal carcinoma"], ans:2,
 ex:"Rapid growth, leaf-like architecture, high stromal cellularity/mitoses, and infiltrative margins indicate a <b>malignant phyllodes tumour</b> — malignancy driven entirely by the stromal component."},
{q:"A 28-year-old breastfeeding woman, 2 weeks postpartum, has fever, pain, redness, and swelling in one breast. FNA shows neutrophils, bacterial colonies, and fat necrosis. Underlying process?",
 opts:["Chronic granulomatous inflammation","Ductal hyperplasia with calcification","Acute suppurative inflammation of the breast lobules","Infiltration of malignant ductal epithelial cells"], ans:2,
 ex:"Fever, redness, and a neutrophilic/bacterial FNA in a breastfeeding woman describe acute (puerperal) <b>mastitis</b> — most often due to <i>S. aureus</i> entering through cracked nipples."}
]
};

/* ---------- render ---------- */
const tabsEl = document.getElementById("tabs");
const mainEl = document.getElementById("main");

TOPICS.forEach((t,i)=>{
  const btn = document.createElement("button");
  btn.className = "tab-btn" + (i===0?" active":"");
  btn.style.borderColor = t.color;
  btn.dataset.target = t.id;
  btn.innerHTML = `<span class="dot" style="background:${t.color}"></span>${t.icon} ${t.label}`;
  btn.addEventListener("click", ()=>showTopic(t.id));
  tabsEl.appendChild(btn);

  const sec = document.createElement("section");
  sec.className = "topic" + (i===0?" active":"");
  sec.id = "sec-"+t.id;

  const mcqCount = MCQ[t.id].length;
  sec.innerHTML = `
    <div class="topic-head">
      <h2>${t.icon} ${t.label}</h2>
      <span class="badge-count" style="background:${t.color}">${mcqCount} MCQs</span>
    </div>
    <div class="keybox" style="border-color:${t.color};">
      <h3 style="color:${t.color}">⭐ Key Takeaways</h3>
      <ul>${KEYPOINTS[t.id].map(k=>`<li>${k}</li>`).join("")}</ul>
    </div>
    <h3 class="section-label">🗂️ Flashcards — tap to flip</h3>
    <div class="flash-grid">
      ${FLASHCARDS[t.id].map(c=>`
        <div class="flash">
          <div class="flash-inner">
            <div class="flash-face front" style="border-color:${t.color};color:${t.color}">${c.f}<div class="flash-hint">tap to reveal</div></div>
            <div class="flash-face back" style="border-color:${t.color}">${c.b}</div>
          </div>
        </div>`).join("")}
    </div>
    <h3 class="section-label">✅ MCQ Quiz</h3>
    <div class="mcq-list" id="mcq-${t.id}"></div>
    <div class="score-bar" style="border-color:${t.color}">
      <span id="score-${t.id}">Score: 0 / ${mcqCount}</span>
      <button id="reset-${t.id}">Reset quiz</button>
    </div>
  `;
  mainEl.appendChild(sec);

  // flashcard flip
  sec.querySelectorAll(".flash").forEach(f=>{
    f.addEventListener("click", ()=>f.classList.toggle("flipped"));
  });

  // mcq render
  const list = sec.querySelector(`#mcq-${t.id}`);
  let score = 0;
  const answered = new Array(mcqCount).fill(false);

  MCQ[t.id].forEach((item, qi)=>{
    const card = document.createElement("div");
    card.className = "mcq";
    card.style.borderColor = t.color;
    card.innerHTML = `
      <span class="q-num" style="background:${t.color}">Q${qi+1}</span>
      <p class="stem">${item.q}</p>
      <div class="opts">
        ${item.opts.map((o,oi)=>`<button class="opt" data-oi="${oi}">${o}</button>`).join("")}
      </div>
      <div class="explain"><b>Explanation:</b> ${item.ex}</div>
    `;
    list.appendChild(card);

    const optBtns = card.querySelectorAll(".opt");
    const explainEl = card.querySelector(".explain");
    optBtns.forEach(btn=>{
      btn.addEventListener("click", ()=>{
        if(answered[qi]) return;
        answered[qi] = true;
        const chosen = parseInt(btn.dataset.oi);
        optBtns.forEach(b=>b.classList.add("disabled"));
        if(chosen === item.ans){
          btn.classList.add("correct");
          score++;
        } else {
          btn.classList.add("incorrect");
          optBtns[item.ans].classList.add("correct");
        }
        explainEl.classList.add("show");
        document.getElementById(`score-${t.id}`).textContent = `Score: ${score} / ${mcqCount}`;
      });
    });
  });

  sec.querySelector(`#reset-${t.id}`).addEventListener("click", ()=>{
    score = 0;
    answered.fill(false);
    list.querySelectorAll(".mcq").forEach(card=>{
      card.querySelectorAll(".opt").forEach(b=>{
        b.classList.remove("correct","incorrect","disabled");
      });
      card.querySelector(".explain").classList.remove("show");
    });
    document.getElementById(`score-${t.id}`).textContent = `Score: 0 / ${mcqCount}`;
  });
});

function showTopic(id){
  document.querySelectorAll("section.topic").forEach(s=>s.classList.toggle("active", s.id === "sec-"+id));
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active", b.dataset.target===id));
  const topic = TOPICS.find(t=>t.id===id);
  document.querySelectorAll(".tab-btn").forEach(b=>{
    if(b.dataset.target===id){ b.style.background = topic.color; }
    else { const tt = TOPICS.find(x=>x.id===b.dataset.target); b.style.background = "var(--panel)"; }
  });
  window.scrollTo({top:0, behavior:"smooth"});
}
// init active tab color
showTopic("male");
