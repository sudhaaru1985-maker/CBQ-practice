let G={
  screen:'map',xp:0,hints:5,streak:0,totalCorrect:0,totalQ:0,
  wardStatus:{},
  cur:{wardIdx:0,qIdx:0,diff:'easy',answered:false,hintUsed:false,qResults:[]},
  timerI:null
};
WARDS.forEach(w=>{ G.wardStatus[w.id]={unlocked:false,done:false,keysFound:[]}; });
G.wardStatus['oa'].unlocked=true;

function totalKeys(){return Object.values(G.wardStatus).reduce((s,w)=>s+w.keysFound.length,0)}
function updateHUD(){
  document.getElementById('h-xp').textContent=G.xp;
  document.getElementById('h-keys').textContent=totalKeys()+' / '+WARDS.reduce((s,w)=>s+w.questions.length,0);
  document.getElementById('h-hints').textContent=G.hints;
  document.getElementById('h-streak').textContent=G.streak>0?G.streak+'🔥':'—';
}

function render(){
  updateHUD();
  const m=document.getElementById('main');
  if(G.screen==='map') renderMap(m);
  else if(G.screen==='ward') renderWard(m);
  else if(G.screen==='unlock') renderUnlock(m);
  else if(G.screen==='escaped') renderEscaped(m);
}

const WARD_COLORS=['#1a5f8a','#9a6200','#c0392b','#6a3d8f'];
const WARD_ICONS=['🦴','🫀','💧','⭐'];

function renderMap(m){
  const allDone=WARDS.every(w=>G.wardStatus[w.id].done);
  m.innerHTML=`
  <div style="background:transparent;border:none;padding:0">
    <div class="map">
      ${WARDS.map((w,i)=>{
        const ws=G.wardStatus[w.id];
        const keys=w.questions.length;
        const found=ws.keysFound.filter(k=>k===true||k===false).length;
        let cls='ward ward-'+(i+1);
        if(ws.done) cls+=' ward-done';
        else if(ws.unlocked) cls+=' ward-active';
        else cls+=' ward-locked';
        const dots=Array.from({length:keys},(_,k)=>{
          let dc='key';
          if(ws.keysFound[k]===true) dc+=' found';
          else if(ws.keysFound[k]===false) dc+=' lost';
          return `<div class="${dc}"></div>`;
        }).join('');
        const statusTxt=ws.done?'✅ Unlocked!':ws.unlocked?`${found}/${keys} keys found`:'🔒 Locked';
        return `<div class="${cls}" onclick="enterWard(${i})">
          <i class="ti ${ws.done?'ti-lock-open':'ti-lock'} lock-icon" aria-hidden="true"></i>
          <div class="ward-num">${ws.done?'Completed':w.name}</div>
          <div class="ward-name">${WARD_ICONS[i]} ${w.displayName}</div>
          <div class="ward-status">${statusTxt}</div>
          <div class="ward-keys">${dots}</div>
        </div>`;
      }).join('')}
    </div>
    ${allDone?`<button class="btn-escape" onclick="G.screen='escaped';render()"><i class="ti ti-door-exit" aria-hidden="true"></i> You escaped! See final results</button>`:''}
    <p style="text-align:center;font-size:14px;color:var(--er-text3);margin-top:0.75rem">Each correct answer = a key. Collect all keys in a ward to unlock the next.</p>
  </div>`;
}

function enterWard(idx){
  const w=WARDS[idx];
  if(!G.wardStatus[w.id].unlocked && !G.wardStatus[w.id].done) return;
  G.cur={wardIdx:idx,qIdx:0,diff:'easy',answered:false,hintUsed:false,qResults:[]};
  G.wardStatus[w.id].keysFound=[];
  emqSelections={};
  G.screen='ward';
  render();
}

function renderWard(m){
  const ward=WARDS[G.cur.wardIdx];
  const allQs=ward.questions;
  const q=allQs[G.cur.qIdx];
  if(!q){showUnlock();return;}

  const diff=q.diff;
  const diffLabel=diff==='easy'?'Easy (Level 1)':diff==='medium'?'Medium (Level 2)':'Hard (Level 3)';
  const badgeCls=diff==='easy'?'badge-e':diff==='medium'?'badge-m':'badge-h';

  const dots=allQs.map((_,i)=>{
    let c='pdot';
    const kr=G.wardStatus[ward.id].keysFound;
    if(i<G.cur.qIdx) c+=kr[i]?' ok':' bad';
    else if(i===G.cur.qIdx) c+=' cur';
    return `<div class="${c}"></div>`;
  }).join('');

  let qHtml='';
  if(q.type==='mcq'){
    qHtml=`<div class="opts" id="opts">`+q.opts.map((o,i)=>`<button class="opt" id="opt${i}" onclick="answerMCQ(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')+`</div>`;
  } else if(q.type==='fitb'){
    qHtml=`<input class="fitb-inp" id="fitb0" placeholder="Your answer…" />`+
    `<div class="btn-row"><button class="btn-sub" onclick="answerFITB()">Submit</button><button class="btn-hint" onclick="useHint()"><i class="ti ti-bulb" aria-hidden="true"></i> Hint (−1)</button></div>`;
  } else if(q.type==='emq'){
    qHtml=q.stages.map((s,si)=>`
      <div class="emq-stage" id="emq-stage-${si}">
        <div class="emq-label">${String.fromCharCode(65+si)}. ${s.label}</div>
        <div class="emq-opts">
          ${s.opts.map((o,oi)=>`<button class="emq-opt" id="emq-${si}-${oi}" onclick="selectEMQ(${si},${oi})">${String.fromCharCode(49+oi)}. ${o}</button>`).join('')}
        </div>
      </div>`).join('')+
    `<div class="btn-row" style="margin-top:14px"><button class="btn-sub" onclick="answerEMQ()">Submit all</button><button class="btn-hint" onclick="useHint()"><i class="ti ti-bulb" aria-hidden="true"></i> Hint (−1)</button></div>`;
  }

  m.innerHTML=`<div class="screen">
    <div class="puzzle-hdr">
      <div class="puzzle-icon"><i class="ti ${ward.icon}" aria-hidden="true"></i></div>
      <div>
        <div class="puzzle-title">${ward.name}: ${ward.displayName}</div>
        <div class="puzzle-sub">Question ${G.cur.qIdx+1} of ${allQs.length} &nbsp;|&nbsp; ${diffLabel}</div>
      </div>
      <button onclick="G.screen='map';stopTimer();render()" style="margin-left:auto;padding:6px 12px;font-size:14px;border:1.5px solid var(--er-border);border-radius:8px;cursor:pointer;color:var(--er-text2);background:var(--er-surface2);font-family:'Nunito',sans-serif"><i class="ti ti-map" aria-hidden="true"></i> Map</button>
    </div>
    <div class="clue-box"><div class="clue-label"><i class="ti ti-file-description" aria-hidden="true"></i> Case file</div>${ward.case}</div>
    <div class="prog"><span class="prog-lbl">Keys:</span><div class="prog-dots">${dots}</div></div>
    <span class="q-badge ${badgeCls}">${diff.charAt(0).toUpperCase()+diff.slice(1)}</span>
    ${q.type==='mcq'?`<div class="timer-row"><div class="t-bg"><div class="t-bar" id="t-bar" style="width:100%"></div></div><span class="t-txt" id="t-txt">${q.time}s</span></div>`:''}
    <div class="q-text">${q.text}</div>
    ${qHtml}
    <div id="fb"></div>
  </div>`;

  if(q.type==='mcq') startTimer(q.time);
}

let timerI=null;
function startTimer(s){
  if(timerI) clearInterval(timerI);
  let rem=s;
  const bar=document.getElementById('t-bar'),txt=document.getElementById('t-txt');
  if(!bar) return;
  timerI=setInterval(()=>{
    rem--;
    const b=document.getElementById('t-bar'),t=document.getElementById('t-txt');
    if(!b){clearInterval(timerI);return;}
    const p=Math.round((rem/s)*100);
    b.style.width=p+'%';
    t.textContent=rem+'s';
    b.style.background=p<35?'#c0392b':p<60?'#9a6200':'#1a7a50';
    if(rem<=0){clearInterval(timerI);if(!G.cur.answered)timeOut();}
  },1000);
}
function stopTimer(){if(timerI){clearInterval(timerI);timerI=null;}}

function timeOut(){
  G.cur.answered=true;G.streak=0;
  const q=WARDS[G.cur.wardIdx].questions[G.cur.qIdx];
  G.wardStatus[WARDS[G.cur.wardIdx].id].keysFound[G.cur.qIdx]=false;
  showFB(false,q.explain,true);updateHUD();
}

function answerMCQ(i){
  if(G.cur.answered) return;
  stopTimer();G.cur.answered=true;
  const q=WARDS[G.cur.wardIdx].questions[G.cur.qIdx];
  const ok=i===q.answer;
  document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('correct');else if(j===i&&!ok)b.classList.add('wrong');});
  awardKey(ok,q.pts);showFB(ok,q.explain);
}
function answerFITB(){
  if(G.cur.answered) return;
  stopTimer();G.cur.answered=true;
  const q=WARDS[G.cur.wardIdx].questions[G.cur.qIdx];
  // Single input box — accept if it matches ANY of the accepted answers
  const inp=(document.getElementById('fitb0')?document.getElementById('fitb0').value.trim().toLowerCase():'');
  const ok=q.answers.some(a=>inp.includes(a.toLowerCase()));
  document.querySelectorAll('.fitb-inp').forEach(el=>el.disabled=true);
  document.querySelectorAll('.btn-sub,.btn-hint').forEach(el=>el.disabled=true);
  awardKey(ok,q.pts);showFB(ok,q.explain);
}
let emqSelections={};
function selectEMQ(si,oi){
  if(G.cur.answered) return;
  emqSelections[si]=oi;
  // Update visual selection
  const stage=document.getElementById('emq-stage-'+si);
  if(!stage) return;
  stage.querySelectorAll('.emq-opt').forEach((b,j)=>{
    b.classList.toggle('emq-selected', j===oi);
  });
}
function answerEMQ(){
  if(G.cur.answered) return;
  stopTimer();G.cur.answered=true;
  const q=WARDS[G.cur.wardIdx].questions[G.cur.qIdx];
  const total=q.stages.length;
  let correct=0;
  q.stages.forEach((s,si)=>{
    const chosen=emqSelections[si];
    const isRight=(chosen===s.answer);
    if(isRight) correct++;
    const stage=document.getElementById('emq-stage-'+si);
    if(stage){
      stage.querySelectorAll('.emq-opt').forEach((b,j)=>{
        b.disabled=true;
        if(j===s.answer) b.classList.add('emq-correct');
        else if(j===chosen && !isRight) b.classList.add('emq-wrong');
      });
    }
  });
  emqSelections={};
  const ok=(correct===total);
  document.querySelectorAll('.btn-sub,.btn-hint').forEach(el=>el.disabled=true);
  awardKey(ok,q.pts);
  // Custom feedback showing score
  const fb=document.getElementById('fb');
  const ward=WARDS[G.cur.wardIdx];
  const allDone=G.cur.qIdx>=ward.questions.length-1;
  const nextLabel=allDone?(ok?'Try to unlock ward':'See results'):'Next question';
  const streak=G.streak>=2?` <strong>${G.streak}🔥 streak bonus +25 XP</strong>`:'';
  if(fb) fb.innerHTML=`<div class="fb ${ok?'fb-ok':'fb-no'}">
    <i class="ti ${ok?'ti-key':'ti-lock'}" aria-hidden="true"></i>
    <strong>${ok?'All correct — Key found!':correct+'/'+total+' correct — No key.'}</strong>${ok?' +'+q.pts+' XP':''}${streak}<br>
    <span style="font-size:14px;margin-top:4px;display:block">${q.explain}</span>
  </div>
  <div class="btn-row">
    <button class="btn-next" onclick="nextQ()">${nextLabel} <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
  </div>`;
}

function awardKey(ok,pts){
  const ward=WARDS[G.cur.wardIdx];
  G.wardStatus[ward.id].keysFound[G.cur.qIdx]=ok;
  if(ok){
    const bonus=G.streak>=2&&!G.cur.hintUsed?25:0;
    G.xp+=pts+bonus;G.streak++;G.totalCorrect++;
  } else {G.streak=0;}
  G.totalQ++;updateHUD();
}

function useHint(){
  if(G.cur.answered||G.cur.hintUsed||G.hints<=0) return;
  G.cur.hintUsed=true;G.hints--;updateHUD();
  const q=WARDS[G.cur.wardIdx].questions[G.cur.qIdx];
  const fb=document.getElementById('fb');
  if(fb) fb.innerHTML=`<div class="fb fb-hint"><i class="ti ti-bulb" aria-hidden="true"></i> <strong>Hint:</strong> ${q.hint}</div>`;
}

function showFB(ok,explain,timeout){
  const fb=document.getElementById('fb');if(!fb) return;
  const q=WARDS[G.cur.wardIdx].questions[G.cur.qIdx];
  const ward=WARDS[G.cur.wardIdx];
  const allDone=G.cur.qIdx>=ward.questions.length-1;
  const keyWord=ok?'Key found!':'No key.';
  const label=timeout?'Time\'s up!':ok?keyWord:'Incorrect — '+keyWord;
  const pts=ok?` +${q.pts} XP`:'';
  const streak=G.streak>=2?` <strong>${G.streak}🔥 streak bonus +25 XP</strong>`:'';
  const nextLabel=allDone?(ok?'Try to unlock ward':'See results'):'Next question';
  fb.innerHTML=`<div class="fb ${ok?'fb-ok':'fb-no'}">
    <i class="ti ${ok?'ti-key':'ti-lock'}" aria-hidden="true"></i> <strong>${label}</strong>${pts}${streak}<br>
    <span style="font-size:14px;margin-top:4px;display:block">${explain}</span>
  </div>
  <div class="btn-row">
    <button class="btn-next" onclick="nextQ()">${nextLabel} <i class="ti ti-arrow-right" aria-hidden="true"></i></button>
  </div>`;
}

function nextQ(){
  stopTimer();
  emqSelections={};
  const ward=WARDS[G.cur.wardIdx];
  if(G.cur.qIdx<ward.questions.length-1){
    G.cur.qIdx++;G.cur.answered=false;G.cur.hintUsed=false;render();
  } else {
    showUnlock();
  }
}

function showUnlock(){
  stopTimer();
  const ward=WARDS[G.cur.wardIdx];
  const ws=G.wardStatus[ward.id];
  const correct=ws.keysFound.filter(Boolean).length;
  const total=ward.questions.length;
  const unlocked=correct===total;
  ws.done=unlocked;
  if(unlocked && G.cur.wardIdx<WARDS.length-1){
    G.wardStatus[WARDS[G.cur.wardIdx+1].id].unlocked=true;
  }
  G.screen='unlock';
  G.cur.unlockResult={correct,total,unlocked,wardIdx:G.cur.wardIdx};
  render();
}

function renderUnlock(m){
  const r=G.cur.unlockResult;
  const ward=WARDS[r.wardIdx];
  const nextWard=r.wardIdx<WARDS.length-1?WARDS[r.wardIdx+1]:null;
  const icon=r.unlocked?'ti-lock-open':'ti-lock';
  const msg=r.unlocked?`Ward unlocked! ${nextWard?nextWard.name+' ('+nextWard.displayName+') is now open.':'You have escaped!'}`:`${r.correct}/${r.total} keys found — ward remains locked. Retry to collect all keys.`;
  m.innerHTML=`<div class="screen">
    <div class="unlock-anim">
      <div class="unlock-big"><i class="ti ${icon}" aria-hidden="true"></i></div>
      <div class="unlock-msg">${r.unlocked?'Ward Unlocked! 🎉':'Ward Still Locked'}</div>
      <div class="unlock-sub">${msg}</div>
      <div style="margin:1rem 0;font-size:16px;color:var(--er-text2)">${r.correct} / ${r.total} keys collected &nbsp;|&nbsp; ${G.xp} XP total</div>
      <div class="btn-row" style="justify-content:center;gap:10px;flex-wrap:wrap">
        <button class="btn-sub" onclick="enterWard(${r.wardIdx})"><i class="ti ti-refresh" aria-hidden="true"></i> Retry ward</button>
        <button class="btn-sub" onclick="G.screen='map';render()"><i class="ti ti-map" aria-hidden="true"></i> Back to map</button>
        ${r.unlocked&&nextWard?`<button class="btn-next" onclick="enterWard(${r.wardIdx+1})">Enter ${nextWard.name} <i class="ti ti-arrow-right" aria-hidden="true"></i></button>`:''}
        ${r.unlocked&&!nextWard?`<button class="btn-escape" onclick="G.screen='escaped';render()"><i class="ti ti-door-exit" aria-hidden="true"></i> Escape!</button>`:''}
      </div>
    </div>
  </div>`;
}

function renderEscaped(m){
  const totalCorrect=Object.values(G.wardStatus).reduce((s,w)=>s+w.keysFound.filter(Boolean).length,0);
  const totalQ=WARDS.reduce((s,w)=>s+w.questions.length,0);
  const pct=Math.round((totalCorrect/totalQ)*100);
  const ranks=[{n:'Medical Student',m:0},{n:'Intern',m:400},{n:'Resident',m:900},{n:'Consultant',m:1600},{n:'Professor',m:2400}];
  let rank=ranks[0].n;for(const r of ranks)if(G.xp>=r.m)rank=r.n;
  m.innerHTML=`<div class="escaped">
    <div class="escaped-trophy"><i class="ti ti-door-exit" aria-hidden="true"></i></div>
    <div class="escaped-title">You Escaped the Arthritis Ward! 🏆</div>
    <div class="escaped-sub">Final rank: <strong>${rank}</strong> &nbsp;|&nbsp; ${G.xp} XP earned</div>
    <div class="final-grid">
      ${WARDS.map((w,i)=>{const ws=G.wardStatus[w.id];const c=ws.keysFound.filter(Boolean).length;return`<div class="f-card"><div class="f-val">${c}/${w.questions.length}</div><div class="f-lbl">${w.name}<br>${w.displayName}</div></div>`;}).join('')}
    </div>
    <div style="font-size:32px;font-weight:700;color:var(--er-accent);margin:0.5rem 0">${pct}%</div>
    <div style="font-size:15px;color:var(--er-text2);margin-bottom:1rem">${totalCorrect} / ${totalQ} keys collected</div>
    <button class="btn-next" onclick="resetGame()"><i class="ti ti-refresh" aria-hidden="true"></i> Play again</button>
  </div>`;
}

function resetGame(){
  stopTimer();
  G={screen:'map',xp:0,hints:5,streak:0,totalCorrect:0,totalQ:0,wardStatus:{},cur:{wardIdx:0,qIdx:0,diff:'easy',answered:false,hintUsed:false,qResults:[]},timerI:null};
  WARDS.forEach(w=>{G.wardStatus[w.id]={unlocked:false,done:false,keysFound:[]};});
  G.wardStatus['oa'].unlocked=true;
  render();
}

render();
</script>
