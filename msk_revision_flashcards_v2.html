<script>
const topicClass = {
  "Crystal arthropathy":"cf-crystal",
  "Inflammatory arthritis":"cf-inflammatory",
  "Degenerative & metabolic":"cf-degenerative",
  "Connective tissue disease":"cf-connective",
  "Bone tumours":"cf-bone",
  "Soft tissue tumours":"cf-soft",
  "Bone disease (genetic/metabolic)":"cf-genetic"
};

const cards = [
  {topic:"Crystal arthropathy",q:"What type of crystals are seen in pseudogout and what is their appearance under polarised light?",a:"Calcium pyrophosphate dihydrate (CPPD) crystals — positively birefringent, rhomboid-shaped under polarised light microscopy."},
  {topic:"Crystal arthropathy",q:"What type of crystals cause acute gout, and how do they appear under polarised light?",a:"Monosodium urate monohydrate — negatively birefringent, needle-shaped crystals. Associated with elevated serum uric acid."},
  {topic:"Crystal arthropathy",q:"Which joint is the classic site of the first gout attack?",a:"The first metatarsophalangeal (MTP) joint — acute, severe pain, erythema, and swelling. Common triggers: alcohol, purine-rich food."},
  {topic:"Crystal arthropathy",q:"What serum investigation confirms a diagnosis of gout?",a:"Elevated serum uric acid (hyperuricaemia). Polarised microscopy of joint aspirate shows needle-shaped negatively birefringent crystals."},
  {topic:"Inflammatory arthritis",q:"What HLA allele is strongly associated with ankylosing spondylitis, and what are the classic X-ray findings?",a:"HLA-B27. X-ray shows bilateral sacroiliitis and 'bamboo spine' — fusion of vertebral bodies with ossification of intervertebral discs."},
  {topic:"Inflammatory arthritis",q:"What are the typical clinical and serological features of rheumatoid arthritis?",a:"Symmetric MCP & PIP joint involvement, morning stiffness >30 min, positive RF and anti-CCP antibodies. Histology: synoviocyte proliferation with pannus formation and lymphoplasmacytic infiltrates."},
  {topic:"Inflammatory arthritis",q:"What is pannus and which disease is it associated with?",a:"Pannus is abnormal proliferating synovial tissue in RA that invades and destroys articular cartilage and bone. Driven by CD4+ T cells."},
  {topic:"Inflammatory arthritis",q:"Patient with dry eyes, dry mouth, parotid enlargement, anti-SSA antibodies. What does minor salivary gland biopsy show?",a:"Sjögren syndrome — focal lymphocytic infiltration destroying salivary acini (predominantly CD4+ T cells)."},
  {topic:"Degenerative & metabolic",q:"What is the primary initiating event in osteoarthritis pathogenesis?",a:"Chondrocyte injury and mechanical degradation of the ECM → MMP release, type II collagen and proteoglycan breakdown, subchondral sclerosis, osteophytes, and low-grade synovial inflammation (IL-1β, TNF-α)."},
  {topic:"Degenerative & metabolic",q:"What are four key radiological features of osteoarthritis?",a:"Joint space narrowing · Osteophyte (spur) formation · Subchondral sclerosis · Subchondral cysts. Morning stiffness <30 min, no significant warmth."},
  {topic:"Degenerative & metabolic",q:"List four risk factors for osteoarthritis.",a:"Ageing · Obesity · Previous joint trauma · Joint malalignment · Repetitive mechanical stress · Sedentary lifestyle · Family history (any 4)."},
  {topic:"Degenerative & metabolic",q:"What is the gold-standard test for osteoporosis and what T-score confirms diagnosis?",a:"DEXA scan. T-score ≤ −2.5 at lumbar spine, femoral neck, or total hip confirms osteoporosis."},
  {topic:"Degenerative & metabolic",q:"Describe the pathogenesis of postmenopausal osteoporosis.",a:"Oestrogen deficiency → ↑RANKL, ↓OPG → enhanced osteoclast activity → bone resorption exceeds formation → trabecular thinning. IL-1, TNF-α accelerate osteoclastogenesis."},
  {topic:"Degenerative & metabolic",q:"What bone disease results from chronic renal failure and what is the mechanism?",a:"Secondary hyperparathyroidism. Chronic hypocalcaemia → ↑PTH → subperiosteal bone resorption. Labs: ↑phosphate, ↓calcium, ↑PTH, ↑ALP."},
  {topic:"Degenerative & metabolic",q:"A dialysis patient has excess unmineralised osteoid on biopsy. What is the mechanism?",a:"Osteomalacia — defective mineralisation caused by decreased active vitamin D (calcitriol), impaired 1α-hydroxylation in diseased kidneys."},
  {topic:"Connective tissue disease",q:"What are the autoantibodies in diffuse systemic sclerosis and what does skin biopsy show?",a:"Anti-topoisomerase I (Scl-70). Biopsy: extensive dermal collagen deposition (fibrosis). Clinically: skin tightening, dysphagia, Raynaud phenomenon."},
  {topic:"Connective tissue disease",q:"What is CREST syndrome and what antibody is associated with it?",a:"Limited systemic sclerosis: Calcinosis, Raynaud, oEsophageal dysmotility, Sclerodactyly, Telangiectasia. Associated with anti-centromere antibodies."},
  {topic:"Connective tissue disease",q:"What is the mechanism of renal injury in SLE?",a:"Type III hypersensitivity — immune complex deposition (DNA / anti-dsDNA) in glomeruli activates complement → glomerulonephritis: proteinuria, haematuria, RBC casts."},
  {topic:"Connective tissue disease",q:"What antibodies are positive in SLE?",a:"ANA (screening) and anti-double-stranded DNA (specific) — with decreased serum complement (C3, C4) due to consumption."},
  {topic:"Bone tumours",q:"What are the characteristic X-ray and histological features of osteosarcoma?",a:"X-ray: Codman triangle + sunburst appearance at metaphysis. Histology: lace-like osteoid by pleomorphic tumour cells. Peak age: adolescents, distal femur/proximal tibia."},
  {topic:"Bone tumours",q:"What genetic translocation is diagnostic of Ewing sarcoma and what does histology show?",a:"EWSR1-FLI1 [t(11;22)]. Histology: sheets of small round blue cells with rosette formation. X-ray: onion-skin periosteal reaction in the diaphysis."},
  {topic:"Bone tumours",q:"Describe the features of giant cell tumour (osteoclastoma).",a:"Adults 20–40 yrs, epiphysis. X-ray: expansile lytic 'soap bubble' lesion. Histology: mononuclear stromal cells with scattered osteoclast-like giant cells. Locally aggressive."},
  {topic:"Bone tumours",q:"What is osteochondroma and what are its features?",a:"Most common benign bone tumour — cartilage-capped bony projection continuous with medullary cavity, arising from metaphysis. Painless, small malignant transformation risk."},
  {topic:"Bone tumours",q:"What are the features of osteoid osteoma?",a:"Young patients. Nocturnal pain relieved by aspirin. X-ray: small lytic nidus surrounded by reactive sclerosis. Histology: woven bone trabeculae lined by osteoblasts in fibrovascular stroma."},
  {topic:"Bone tumours",q:"What tumour can complicate Paget disease, and what is the biopsy finding?",a:"Osteosarcoma — new lytic lesion in Paget bone, markedly ↑ALP, biopsy: pleomorphic spindle cells with osteoid production (no cartilaginous matrix)."},
  {topic:"Bone tumours",q:"What are the features of chondrosarcoma?",a:"Adults >40 yrs. X-ray: lytic lesion with calcifications, soft tissue extension. Gross: bluish-white glistening tumour. Histology: pleomorphic chondrocytes with atypical mitoses."},
  {topic:"Soft tissue tumours",q:"What is the characteristic histological pattern of synovial sarcoma and its diagnostic translocation?",a:"Biphasic: epithelial-like cuboidal cells forming glands + uniform spindle cells. EMA positive. Translocation t(X;18)(p11;q11). Arises near (not in) joints."},
  {topic:"Soft tissue tumours",q:"What are the features of nodular fasciitis?",a:"Reactive, rapidly growing mass in young adults after minor trauma. Histology: immature fibroblasts in loose myxoid stroma, abundant normal (not atypical) mitotic figures. Self-limiting."},
  {topic:"Soft tissue tumours",q:"What is the hallmark histological feature of embryonal rhabdomyosarcoma?",a:"Cambium layer — dense zone of primitive cells immediately beneath the surface epithelium. IHC: desmin and myogenin positive (skeletal muscle lineage)."},
  {topic:"Soft tissue tumours",q:"What are the gross and histological features of fibrosarcoma?",a:"Gross: unencapsulated, infiltrative, fish-flesh appearance with haemorrhage/necrosis. Histology: highly cellular atypical spindle cells in herringbone pattern, numerous mitoses."},
  {topic:"Soft tissue tumours",q:"What is a liposarcoma and what is the hallmark cell on histology?",a:"Malignant adipocytic tumour — hallmark is the lipoblast: large cell with cytoplasmic vacuolation scalloping the nucleus. Gross: yellow solid mass with central necrosis."},
  {topic:"Soft tissue tumours",q:"How does a ganglion cyst differ from synovial sarcoma clinically?",a:"Ganglion cyst: benign, soft, fluctuant, transilluminates, no systemic signs. Synovial sarcoma: deep, painful, heterogeneous on MRI, near but not inside the joint."},
  {topic:"Bone disease (genetic/metabolic)",q:"What are the features of osteogenesis imperfecta?",a:"Defect in type I collagen (COL1A1/COL1A2). Features: recurrent fractures, blue sclerae, hearing impairment, dentinogenesis imperfecta. Most forms autosomal dominant."},
  {topic:"Bone disease (genetic/metabolic)",q:"What is osteopetrosis and why does it cause anaemia and hepatosplenomegaly?",a:"Osteoclast dysfunction → failure of bone resorption → obliterated medullary cavity → no space for haematopoiesis → anaemia and extramedullary haematopoiesis (hepatosplenomegaly)."},
];

const topics = [...new Set(cards.map(c=>c.topic))];
let activeTopic = null, idx = 0, flipped = false;

function filteredCards(){return activeTopic?cards.filter(c=>c.topic===activeTopic):cards}
function applyTheme(c){
  const cls=topicClass[c.topic]||'cf-inflammatory';
  const w=document.getElementById('cardwrap');
  Object.values(topicClass).forEach(v=>w.classList.remove(v));
  w.classList.add(cls);
}
function renderFilter(){
  const f=document.getElementById('filter');
  let h=`<span class="pill ${activeTopic===null?'sel':''}" onclick="setTopic(null)">All (${cards.length})</span>`;
  topics.forEach(t=>{h+=`<span class="pill ${activeTopic===t?'sel':''}" onclick="setTopic('${t}')">${t} (${cards.filter(c=>c.topic===t).length})</span>`});
  f.innerHTML=h;
}
function setTopic(t){activeTopic=t;idx=0;flipped=false;renderFilter();renderCard()}
function renderCard(){
  const fc=filteredCards();const c=fc[idx];
  document.getElementById('cq').textContent=c.q;
  document.getElementById('ca').textContent=c.a;
  document.getElementById('ctr').textContent=`${idx+1} / ${fc.length}`;
  document.getElementById('pbar').style.width=`${((idx+1)/fc.length)*100}%`;
  document.getElementById('cardwrap').classList.remove('flipped');
  flipped=false;applyTheme(c);
}
function flipCard(){flipped=!flipped;document.getElementById('cardwrap').classList.toggle('flipped',flipped)}
function nextCard(){const fc=filteredCards();idx=(idx+1)%fc.length;renderCard()}
function prevCard(){const fc=filteredCards();idx=(idx-1+fc.length)%fc.length;renderCard()}

const quizData = [
  {q:"Which crystal type is positively birefringent and rhomboid-shaped under polarised light?",opts:["Monosodium urate","Calcium pyrophosphate dihydrate","Calcium hydroxyapatite","Cholesterol monohydrate"],ans:1,exp:"CPPD crystals cause pseudogout — positively birefringent and rhomboid. Urate crystals (gout) are negatively birefringent and needle-shaped."},
  {q:"Postmenopausal osteoporosis is primarily driven by:",opts:["↑calcitonin secretion","↑RANKL and ↓osteoprotegerin due to oestrogen deficiency","Primary hyperparathyroidism","Vitamin D deficiency alone"],ans:1,exp:"Oestrogen deficiency upregulates RANKL and reduces OPG, tipping the balance toward osteoclast activity and net bone loss."},
  {q:"A 15-year-old with a destructive distal femur lesion showing Codman triangle. Most likely diagnosis:",opts:["Ewing sarcoma","Osteosarcoma","Giant cell tumour","Chondrosarcoma"],ans:1,exp:"Osteosarcoma typically affects adolescents at the metaphysis of long bones. Codman triangle (periosteal elevation) and sunburst pattern are classic X-ray signs."},
  {q:"Ewing sarcoma is associated with which genetic alteration?",opts:["IDH1/IDH2 mutation","Loss of RB gene","EWSR1-FLI1 translocation","EXT gene mutation"],ans:2,exp:"t(11;22) results in EWSR1-FLI1 fusion. Histology shows small round blue cells with rosette formation; X-ray shows onion-skin periosteal reaction."},
  {q:"T-score ≤ −2.5 on DEXA scan is diagnostic of:",opts:["Osteopenia","Osteoporosis","Osteomalacia","Osteopetrosis"],ans:1,exp:"WHO criteria: T-score −1 to −2.5 = osteopenia; ≤ −2.5 = osteoporosis. DEXA is the gold standard."},
  {q:"Which HLA allele is most strongly associated with ankylosing spondylitis?",opts:["HLA-DR4","HLA-B27","HLA-B51","HLA-DR1"],ans:1,exp:"HLA-B27 is present in >90% of ankylosing spondylitis patients. RF and ANA are negative."},
  {q:"What is the hallmark histological finding in giant cell tumour of bone?",opts:["Lace-like osteoid by pleomorphic cells","Mononuclear stromal cells with scattered osteoclast-like giant cells","Small round blue cells in rosettes","Biphasic spindle and epithelial cell pattern"],ans:1,exp:"GCT (osteoclastoma): epiphyseal soap-bubble lytic lesion. Mononuclear stromal cells with osteoclast-like giant cells. Locally aggressive."},
  {q:"Renal injury in SLE occurs via which mechanism?",opts:["Type II antibody-mediated GBM destruction","Type IV delayed hypersensitivity","Type III immune complex deposition with complement activation","Direct bacterial invasion"],ans:2,exp:"DNA-anti-dsDNA immune complexes deposit in glomeruli → complement activation → glomerulonephritis. Decreased C3/C4 confirms active disease."},
  {q:"Which autoantibody is associated with limited systemic sclerosis (CREST)?",opts:["Anti-topoisomerase I","Anti-dsDNA","Anti-centromere","Anti-SSA (Ro)"],ans:2,exp:"Anti-centromere = CREST/limited SSc. Anti-topoisomerase I (Scl-70) = diffuse SSc. Anti-SSA = Sjögren. Anti-dsDNA = SLE."},
  {q:"Osteomalacia in renal failure is caused by:",opts:["Excessive calcitonin","Decreased active vitamin D (calcitriol)","Autoimmune destruction of osteoblasts","Metastatic calcification"],ans:1,exp:"Renal disease → impaired 1α-hydroxylation → ↓calcitriol → defective mineralisation → excess unmineralised osteoid."},
  {q:"The cambium layer beneath surface epithelium is characteristic of which tumour?",opts:["Liposarcoma","Fibrosarcoma","Embryonal rhabdomyosarcoma","Synovial sarcoma"],ans:2,exp:"Botryoid embryonal RMS has a dense cambium layer of primitive cells just beneath the epithelium. IHC: desmin and myogenin positive."},
  {q:"Nodular fasciitis differs from sarcoma because:",opts:["It lacks mitotic figures","It has atypical mitoses only","It is reactive and self-limiting with normal mitotic figures in a myxoid stroma","It shows herringbone pattern"],ans:2,exp:"Nodular fasciitis is reactive — it can look alarming histologically but mitoses are normal (not atypical), and the lesion is self-limiting."},
  {q:"Osteogenesis imperfecta results from a defect in which protein?",opts:["Fibrillin-1","Elastin","Type I collagen","Osteocalcin"],ans:2,exp:"COL1A1/COL1A2 mutations → defective type I collagen → brittle bones, blue sclerae, hearing loss, dentinogenesis imperfecta."},
  {q:"A 'soap bubble' lytic lesion at the epiphysis of the proximal tibia in a 28-year-old is most likely:",opts:["Osteosarcoma","Enchondroma","Giant cell tumour","Osteochondroma"],ans:2,exp:"GCT (osteoclastoma) typically occurs in skeletally mature young adults at the epiphysis. Soap-bubble appearance on X-ray is characteristic."},
  {q:"Anti-CCP antibodies are most specific for which condition?",opts:["Osteoarthritis","Ankylosing spondylitis","Rheumatoid arthritis","Systemic lupus erythematosus"],ans:2,exp:"Anti-cyclic citrullinated peptide (anti-CCP) antibodies have high specificity (~95%) for RA and can predict erosive disease."},
];

let qi=0,qcorrect=0,qwrong=0,qAnswered=false;
function renderQuiz(){
  const d=document.getElementById('quiz-content');
  if(qi>=quizData.length){
    const pct=Math.round((qcorrect/quizData.length)*100);
    d.innerHTML=`<div style="text-align:center;padding:2rem 0">
      <div style="font-size:40px;font-weight:500;color:var(--color-text-primary);margin-bottom:8px">${pct}%</div>
      <div style="font-size:17px;color:var(--color-text-secondary);margin-bottom:1.5rem">${qcorrect} / ${quizData.length} correct</div>
      <button class="next-btn" style="max-width:220px;margin:0 auto" onclick="resetQuiz()">Restart quiz</button>
    </div>`;return;
  }
  document.getElementById('qscore').textContent=qcorrect;
  document.getElementById('qwrong').textContent=qwrong;
  document.getElementById('qleft').textContent=quizData.length-qi;
  const q=quizData[qi];
  let optsH=q.opts.map((o,i)=>`<button class="opt" id="opt${i}" onclick="selectOpt(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('');
  d.innerHTML=`<div class="quiz-q"><strong>Q${qi+1}.</strong> ${q.q}</div><div class="quiz-opts">${optsH}</div><div id="qfb"></div><button class="next-btn" id="qnext" style="display:none" onclick="nextQ()">Next question →</button>`;
  qAnswered=false;
}
function selectOpt(i){
  if(qAnswered)return;qAnswered=true;
  const q=quizData[qi];const correct=i===q.ans;
  if(correct)qcorrect++;else qwrong++;
  q.opts.forEach((_,j)=>{const b=document.getElementById('opt'+j);if(j===q.ans)b.classList.add('correct');else if(j===i&&!correct)b.classList.add('wrong');b.disabled=true;});
  document.getElementById('qfb').innerHTML=`<div class="quiz-feedback ${correct?'fb-correct':'fb-wrong'}"><strong>${correct?'Correct!':'Incorrect.'}</strong> ${q.exp}</div>`;
  document.getElementById('qnext').style.display='block';
  document.getElementById('qscore').textContent=qcorrect;document.getElementById('qwrong').textContent=qwrong;
}
function nextQ(){qi++;renderQuiz()}
function resetQuiz(){qi=0;qcorrect=0;qwrong=0;renderQuiz()}

function renderRef(){
  const g=document.getElementById('refgrid');
  g.innerHTML=refData.map(sec=>`<div class="info-card"><h3>${sec.title}</h3>${sec.rows.map(r=>`<div class="info-row"><span class="k">${r[0]}</span><span class="v">${r[1]}</span></div>`).join('')}</div>`).join('');

function switchTab(t){
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['flash','quiz','ref'][i]===t));
  document.getElementById('flash-view').style.display=t==='flash'?'':'none';
  document.getElementById('quiz-view').style.display=t==='quiz'?'':'none';
  document.getElementById('ref-view').style.display=t==='ref'?'':'none';
  if(t==='ref')renderRef();
  if(t==='quiz')renderQuiz();
}
