<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pathology Revision: Flashcards &amp; MCQs</title>
<style>
  :root{
    --bg:#f7f8fb;
    --panel:#ffffff;
    --ink:#1c2230;
    --ink-soft:#5b6472;
    --border:#e3e6ec;
    --accent:#3454d1;
    --accent-soft:#eef1fd;
    --good:#1c8a5b;
    --good-soft:#e7f7ef;
    --bad:#c0392b;
    --bad-soft:#fcecea;
    --amber:#b8790a;
    --radius:14px;
    --shadow:0 1px 2px rgba(20,25,40,.04), 0 8px 24px rgba(20,25,40,.06);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    display:flex;
    min-height:100vh;
  }
  /* Sidebar */
  .sidebar{
    width:280px;
    flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--border);
    padding:20px 16px 24px;
    overflow-y:auto;
  }
  .brand{
    font-size:15px;
    font-weight:700;
    letter-spacing:.2px;
    margin:4px 4px 2px;
  }
  .brand-sub{
    font-size:12px;
    color:var(--ink-soft);
    margin:0 4px 18px;
  }
  .mode-toggle{
    display:flex;
    gap:6px;
    background:var(--accent-soft);
    padding:4px;
    border-radius:10px;
    margin-bottom:18px;
  }
  .mode-toggle button{
    flex:1;
    border:none;
    background:transparent;
    padding:8px 6px;
    font-size:12.5px;
    font-weight:600;
    color:var(--accent);
    border-radius:8px;
    cursor:pointer;
  }
  .mode-toggle button.active{
    background:var(--accent);
    color:#fff;
  }
  .topic-list{
    list-style:none;
    margin:0;
    padding:0;
  }
  .topic-list li{
    margin-bottom:4px;
  }
  .topic-btn{
    width:100%;
    text-align:left;
    border:1px solid transparent;
    background:transparent;
    padding:9px 10px;
    border-radius:10px;
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    line-height:1.3;
  }
  .topic-btn:hover{background:var(--bg);}
  .topic-btn.active{
    background:var(--accent-soft);
    border-color:#c7d1f7;
    color:var(--accent);
    font-weight:600;
  }
  .topic-count{
    font-size:11px;
    color:var(--ink-soft);
    background:var(--bg);
    padding:1px 7px;
    border-radius:20px;
    flex-shrink:0;
  }
  .topic-btn.active .topic-count{
    color:var(--accent);
    background:#fff;
  }
  .sidebar-section-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.6px;
    color:var(--ink-soft);
    margin:18px 4px 8px;
    font-weight:700;
  }
  /* Main */
  .main{
    flex:1;
    padding:32px 40px 60px;
    max-width:920px;
  }
  .header-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:22px;
    gap:20px;
    flex-wrap:wrap;
  }
  .header-row h1{
    font-size:22px;
    margin:0 0 4px;
  }
  .header-row p{
    margin:0;
    color:var(--ink-soft);
    font-size:13.5px;
  }
  .score-pill{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 16px;
    font-size:13px;
    color:var(--ink-soft);
    box-shadow:var(--shadow);
    white-space:nowrap;
  }
  .score-pill b{color:var(--ink);}

  /* Flashcard */
  .card-stage{
    perspective:1600px;
    margin:10px 0 18px;
  }
  .flashcard{
    position:relative;
    width:100%;
    min-height:260px;
    border-radius:var(--radius);
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.4,.2,.2,1);
  }
  .flashcard.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:var(--radius);
    padding:28px 30px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
  }
  .face-front{
    background:linear-gradient(160deg,#3454d1,#5872e0);
    color:#fff;
  }
  .face-back{
    background:var(--panel);
    color:var(--ink);
    transform:rotateY(180deg);
  }
  .face-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.8px;
    opacity:.8;
    margin-bottom:12px;
    font-weight:700;
  }
  .face-front .face-label{color:#dbe1fb;}
  .face-back .face-label{color:var(--accent);opacity:1;}
  .face-text{
    font-size:17px;
    line-height:1.55;
    font-weight:500;
  }
  .face-hint{
    position:absolute;
    bottom:16px;
    right:20px;
    font-size:11px;
    opacity:.75;
  }
  .card-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .card-nav-left, .card-nav-right{display:flex;gap:8px;}
  .btn{
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--ink);
    padding:9px 16px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .btn:hover{border-color:#c7cede;}
  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .btn.primary:hover{background:#2a44b8;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .progress-text{
    font-size:12.5px;
    color:var(--ink-soft);
  }

  /* MCQ */
  .quiz-card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:26px 28px;
    box-shadow:var(--shadow);
  }
  .quiz-topic-tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--accent);
    background:var(--accent-soft);
    padding:3px 10px;
    border-radius:20px;
    margin-bottom:14px;
  }
  .quiz-stem{
    font-size:16px;
    line-height:1.6;
    margin-bottom:20px;
  }
  .quiz-options{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:8px;
  }
  .quiz-option{
    text-align:left;
    border:1.5px solid var(--border);
    background:var(--bg);
    padding:12px 14px;
    border-radius:10px;
    font-size:14px;
    line-height:1.45;
    cursor:pointer;
    display:flex;
    gap:10px;
  }
  .quiz-option .opt-letter{
    font-weight:700;
    color:var(--ink-soft);
    flex-shrink:0;
  }
  .quiz-option:hover:not(.disabled){border-color:#aeb9d6;background:#fff;}
  .quiz-option.correct{
    background:var(--good-soft);
    border-color:var(--good);
  }
  .quiz-option.correct .opt-letter{color:var(--good);}
  .quiz-option.incorrect{
    background:var(--bad-soft);
    border-color:var(--bad);
  }
  .quiz-option.incorrect .opt-letter{color:var(--bad);}
  .quiz-option.disabled{cursor:default;}
  .quiz-option.dim{opacity:.55;}
  .explanation{
    margin-top:16px;
    padding:14px 16px;
    border-radius:10px;
    font-size:13.5px;
    line-height:1.6;
    display:none;
  }
  .explanation.show{display:block;}
  .explanation.correct-box{background:var(--good-soft);color:#155c3d;}
  .explanation.incorrect-box{background:var(--bad-soft);color:#8f2a1e;}
  .explanation b{display:block;margin-bottom:4px;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;}
  .quiz-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
  }

  /* Summary */
  .summary-box{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:30px;
    text-align:center;
    box-shadow:var(--shadow);
  }
  .summary-box .big-score{
    font-size:42px;
    font-weight:800;
    color:var(--accent);
    margin:6px 0;
  }
  .summary-list{
    text-align:left;
    margin-top:22px;
    border-top:1px solid var(--border);
    padding-top:16px;
  }
  .summary-row{
    display:flex;
    justify-content:space-between;
    padding:7px 2px;
    font-size:13px;
    border-bottom:1px dashed var(--border);
  }
  .summary-row:last-child{border-bottom:none;}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .setup-row{
    display:flex;
    gap:12px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .chip-select{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .chip{
    border:1px solid var(--border);
    background:var(--panel);
    padding:7px 13px;
    border-radius:20px;
    font-size:12.5px;
    cursor:pointer;
    color:var(--ink-soft);
    font-weight:600;
  }
  .chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  @media (max-width: 820px){
    .app{flex-direction:column;}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);}
    .main{padding:24px 18px 50px;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">🩺 Pathology Revision</div>
    <div class="brand-sub">Flashcards &amp; critical-thinking MCQs</div>

    <div class="mode-toggle">
      <button id="modeFlashBtn" class="active">Flashcards</button>
      <button id="modeQuizBtn">MCQ Quiz</button>
    </div>

    <div class="sidebar-section-label">Topics</div>
    <ul class="topic-list" id="topicList"></ul>
  </aside>

  <main class="main" id="mainArea"></main>
</div>

<script>
const TOPICS = [{"id": "cell-injury", "name": "General Pathology: Cell Injury, Adaptation, Accumulation & Necrosis", "mcqs": [{"stem": "A 58-year-old woman with poorly controlled hypertension for 12 years undergoes echocardiography for exertional breathlessness, which reveals a left ventricular wall thickness of 1.6 cm (normal <1.1 cm) with a normal chamber size and preserved ejection fraction. Which of the following best explains the cellular basis of this myocardial change?", "options": ["Increased number of myocardial fibers", "Increase in the size of individual myocardial fibers", "Replacement of myocytes by fibrous tissue", "Squamous transformation of myocardial cells"], "answer": 1, "explanation": "Cardiac myocytes are terminally differentiated and cannot proliferate, so chronic pressure overload causes hypertrophy (increased cell size via more sarcomeres/organelles), not hyperplasia."}, {"stem": "A 68-year-old man undergoes mitral valve replacement for severe stenosis. The excised valve is thickened, deformed, and studded with firm white nodules; histology confirms calcium deposits. Serum calcium, phosphate, and PTH are all normal. What is the most likely explanation for the calcification?", "options": ["Ectopic calcification of normal tissue due to hypercalcemia", "Calcium deposition in previously damaged/necrotic tissue", "Renal osteodystrophy-related calcium deposition", "Vitamin D-mediated calcium deposition"], "answer": 1, "explanation": "Dystrophic calcification occurs in damaged or necrotic tissue despite normal serum calcium, unlike metastatic calcification which occurs in normal tissue secondary to hypercalcemia."}, {"stem": "A 70-year-old man dies 5 days after an episode of severe chest pain. Autopsy of the heart shows a well-demarcated yellow-tan area of softening in the anterior left ventricular wall, with dense macrophage infiltration at the margins and early granulation tissue, but no residual neutrophils. This appearance most likely corresponds to which time interval after infarction?", "options": ["4\u201312 hours", "1\u20133 days", "5\u201310 days", "6 weeks"], "answer": 2, "explanation": "By 5\u201310 days, the infarct is maximally yellow and soft (macrophage-mediated clearance of debris) with early granulation tissue forming at the margins \u2014 also the period of greatest risk for free wall rupture."}, {"stem": "A 58-year-old woman in septic shock develops acute kidney injury. A kidney biopsy at this early stage shows proximal tubular cells with cytoplasmic swelling and plasma membrane blebbing, but intact nuclei and plasma membranes. Which mechanism best explains these changes?", "options": ["Irreversible mitochondrial permeability transition", "Failure of Na+/K+-ATPase leading to intracellular water and sodium accumulation", "Enzymatic digestion of cell contents by lysosomal enzymes", "Activation of caspases initiating programmed cell death"], "answer": 1, "explanation": "Cellular swelling from ATP depletion and ion pump failure is the hallmark of reversible ischemic injury; membrane blebbing without rupture or nuclear change indicates the injury is still reversible."}, {"stem": "A 45-year-old man sustains complete transection of the peroneal nerve during knee surgery. Six months later, examination shows marked wasting of the anterior compartment leg muscles supplied by that nerve, with muscles elsewhere unaffected. Which adaptation best explains this?", "options": ["Atrophy due to reduced hormonal stimulation", "Atrophy due to loss of trophic neural stimulation", "Atrophy due to reduced blood supply", "Physiologic atrophy of aging"], "answer": 1, "explanation": "Denervation atrophy results from loss of neurotrophic stimulation and disuse of the muscle following nerve injury."}, {"stem": "A 55-year-old man with hereditary spherocytosis and chronic hemolysis undergoes splenectomy. Histology of the spleen shows abundant golden-brown granular pigment within macrophages that stains blue with Prussian blue stain. What is this pigment?", "options": ["Lipofuscin", "Hemozoin", "Hemosiderin", "Bilirubin"], "answer": 2, "explanation": "Hemosiderin is an iron-storage pigment derived from hemoglobin breakdown; it accumulates in macrophages during chronic hemolysis and stains positive with Prussian blue (Perls) stain."}, {"stem": "A 35-year-old woman steps on a rusty nail and develops a deep foot wound. Five days later the wound is swollen, erythematous, and draining thick yellow-green fluid. Debridement reveals soft, liquefied tissue at the wound base. What type of necrosis does this represent?", "options": ["Coagulative necrosis", "Caseous necrosis", "Liquefactive necrosis", "Fat necrosis"], "answer": 2, "explanation": "Bacterial infection causes liquefactive necrosis due to enzymatic digestion of tissue by neutrophil-derived enzymes, producing pus."}], "flashcards": [{"front": "Chronic pressure overload on cardiac myocytes (e.g., hypertension) causes which cellular adaptation, and why not hyperplasia?", "back": "Hypertrophy \u2014 increase in cell size (more organelles/contractile proteins), not number, because cardiac myocytes are terminally differentiated and cannot undergo mitosis."}, {"front": "What distinguishes dystrophic calcification from metastatic calcification?", "back": "Dystrophic calcification occurs in damaged/necrotic tissue with normal serum calcium (e.g., calcified valves, atherosclerotic plaques, caseous TB). Metastatic calcification occurs in normal tissue due to hypercalcemia."}, {"front": "What is the earliest hallmark of reversible ischemic cell injury?", "back": "Cellular swelling from failure of the Na+/K+-ATPase pump (ATP depletion), with membrane blebbing but an intact nucleus and plasma membrane."}, {"front": "When during the evolution of a myocardial infarct is the risk of free wall rupture highest, and why?", "back": "Around day 4\u201310, when the infarct is maximally yellow and soft as macrophages clear necrotic debris \u2014 the weakened wall is most prone to rupture before collagen deposition strengthens it."}, {"front": "What type of atrophy follows loss of nerve supply to skeletal muscle?", "back": "Denervation atrophy \u2014 loss of neurotrophic stimulation and disuse cause progressive myofiber shrinkage."}, {"front": "What pigment accumulates in macrophages in chronic hemolytic states, and how is it detected histochemically?", "back": "Hemosiderin, an iron-storage pigment from hemoglobin breakdown; detected with Prussian blue (Perls) stain."}, {"front": "What determines whether necrosis is coagulative or liquefactive?", "back": "Most solid organs (heart, kidney, spleen) undergo coagulative necrosis (preserved cell outlines despite loss of nucleus). The brain and pyogenic bacterial infections undergo liquefactive necrosis (enzymatic digestion, pus formation)."}]}, {"id": "inflammation-repair", "name": "Inflammation, Wound Healing & Repair", "mcqs": [{"stem": "A 19-year-old man notices that a scar from an earlier ear piercing has continued to grow beyond the original piercing site over the past year, becoming a firm, raised, shiny, dark-pink nodule. It has not regressed despite the wound healing months ago. Which of the following best explains the pathogenesis of this lesion?", "options": ["Reduced fibroblast activity with thin, disorganized collagen", "Persistent bacterial infection with chronic granulation tissue", "Excessive, disorganized collagen synthesis extending beyond wound margins", "Contracture from myofibroblast-mediated wound closure"], "answer": 2, "explanation": "A keloid results from excessive, disorganized collagen deposition that extends beyond the original wound margins, distinguishing it from a hypertrophic scar (which stays within the wound margins)."}, {"stem": "A 68-year-old man who had a myocardial infarction 10 days ago undergoes cardiac biopsy as part of a research protocol. The infarcted area shows abundant new capillaries, proliferating fibroblasts, and loose collagen. Which cell type is primarily responsible for clearing necrotic debris and orchestrating this repair process?", "options": ["Neutrophils", "Eosinophils", "Macrophages", "Mast cells"], "answer": 2, "explanation": "Macrophages phagocytose necrotic debris and secrete growth factors (VEGF, TGF-\u03b2, PDGF) that drive granulation tissue formation and repair."}, {"stem": "A 6-year-old unvaccinated boy develops rapidly progressive sore throat, drooling, and stridor over several hours. Examination reveals a cherry-red, swollen epiglottis. He is at greatest immediate risk of death from which consequence of this acute inflammatory process?", "options": ["Fibrous scarring narrowing the airway over weeks", "Vascular congestion causing mild throat discomfort", "Exudative edema of the epiglottis causing acute airway obstruction", "Formation of a peritonsillar abscess"], "answer": 2, "explanation": "Acute inflammation increases vascular permeability, causing exudative edema of the epiglottis that can rapidly obstruct the airway \u2014 the immediate life-threatening danger, not the later fibrotic changes of chronic inflammation."}, {"stem": "A 65-year-old obese man with poorly controlled diabetes undergoes emergency laparotomy for a perforated viscus. On postoperative day 4, he strains while coughing and suddenly feels a 'giving way' at the incision site, followed by protrusion of bowel loops through the wound. Which complication of wound healing has occurred?", "options": ["Keloid formation", "Wound dehiscence", "Chronic incisional hernia", "Hypertrophic scar"], "answer": 1, "explanation": "Sudden postoperative rupture of a wound with organ protrusion is wound dehiscence, favored by risk factors such as diabetes, obesity, infection, and raised intra-abdominal pressure."}, {"stem": "A 25-year-old woman sustains a deep thermal burn to the palm of her hand that heals by secondary intention. Over the following months she develops progressive difficulty extending her fingers as the healed skin tightens. Which cell type is primarily responsible for this contracture?", "options": ["Neutrophils", "Endothelial cells", "Myofibroblasts", "Keratinocytes"], "answer": 2, "explanation": "Myofibroblasts, which express smooth-muscle actin, generate the contractile force responsible for wound contracture \u2014 most pronounced over flexor surfaces and joints after burns."}], "flashcards": [{"front": "Why do keloids extend beyond the original wound margin while hypertrophic scars do not?", "back": "Keloids result from excessive, disorganized (and genetically predisposed) collagen synthesis that continues to grow beyond the wound edges; hypertrophic scars have excess collagen but stay confined within the original wound."}, {"front": "Which cell orchestrates the transition from acute inflammation to repair/granulation tissue formation, and how?", "back": "Macrophages \u2014 they phagocytose necrotic debris and secrete growth factors (VEGF, PDGF, TGF-\u03b2) that stimulate angiogenesis and fibroblast proliferation."}, {"front": "Why can acute epiglottitis be rapidly fatal even though it's 'just inflammation'?", "back": "Acute inflammatory exudation causes rapid mucosal edema in the confined, narrow airway of the epiglottis/larynx, producing life-threatening airway obstruction within hours."}, {"front": "What clinical picture defines wound dehiscence, and what are its major risk factors?", "back": "Sudden postoperative separation of a wound (sometimes with organ evisceration), promoted by diabetes, obesity, infection, poor nutrition, and raised intra-abdominal pressure (coughing/straining)."}, {"front": "What cell type mediates wound contracture, and what is its distinguishing molecular feature?", "back": "Myofibroblasts \u2014 fibroblasts that express smooth-muscle actin, allowing them to generate contractile force during wound closure, especially problematic over joints after burns."}]}, {"id": "hemostasis", "name": "Hemostasis, Thrombosis & Embolism", "mcqs": [{"stem": "A 72-year-old woman is immobilized for 10 days after a hip fracture. She suddenly develops pleuritic chest pain, tachypnea, and hypoxia. CT pulmonary angiography confirms bilateral pulmonary emboli. Which statement about the source of these emboli is correct?", "options": ["Most originate from thrombi in superficial leg veins", "Most originate from thrombi in the proximal deep veins (popliteal/femoral/iliac)", "Most originate from right atrial mural thrombi", "Most originate from thrombosed pulmonary arterioles in situ"], "answer": 1, "explanation": "More than 90% of pulmonary emboli arise from deep vein thrombosis in the proximal lower-extremity veins."}, {"stem": "A 32-year-old woman who is 8 months pregnant develops sudden unilateral calf swelling and tenderness, followed two days later by acute dyspnea and pleuritic chest pain. Doppler ultrasound confirms a deep venous thrombus. Which is the primary mechanism predisposing her to this complication?", "options": ["Decreased synthesis of clotting factors", "A hypercoagulable state from pregnancy-related increases in clotting factors plus venous stasis", "Direct endothelial trauma from the gravid uterus alone", "Atrial fibrillation-related stasis"], "answer": 1, "explanation": "Pregnancy produces a hypercoagulable state (\u2191fibrinogen, factors VII\u2013X, \u2193protein S) combined with venous stasis from uterine compression \u2014 two limbs of Virchow's triad."}, {"stem": "A 7-year-old boy with a known bleeding disorder and low factor VIII levels sustains a minor fall while playing and does not receive factor VIII replacement. Over the next 24 hours he develops a swollen, painful, warm knee joint with reduced range of motion. Which complication has most likely occurred?", "options": ["Septic arthritis", "Hemarthrosis", "Reactive synovitis", "Gouty arthritis"], "answer": 1, "explanation": "Recurrent bleeding into joints (hemarthrosis) is the classic complication of untreated hemophilia A and can lead to chronic destructive arthropathy."}, {"stem": "A 3-year-old boy bruises easily and develops a large hematoma after a minor immunization injection. His maternal uncle had a similar bleeding tendency and required lifelong factor VIII infusions; his mother and sister are asymptomatic. Which inheritance pattern best fits this family history?", "options": ["Autosomal dominant", "Autosomal recessive", "X-linked recessive", "X-linked dominant"], "answer": 2, "explanation": "Hemophilia A is X-linked recessive: affected males, asymptomatic female carriers, and transmission through the maternal line (an affected maternal uncle) are classic clues."}, {"stem": "A 60-year-old man who recently underwent knee replacement surgery and has been largely immobile for 3 weeks develops unilateral calf swelling, warmth, and tenderness. Doppler ultrasound confirms thrombosis of the deep femoral vein. Which laboratory finding would be expected to support this diagnosis?", "options": ["Elevated D-dimer", "Decreased fibrinogen", "Prolonged bleeding time", "Decreased platelet count"], "answer": 0, "explanation": "D-dimer, a fibrin degradation product, is elevated with active thrombus formation and breakdown; it is sensitive but not specific for DVT/PE."}], "flashcards": [{"front": "Where do the vast majority of pulmonary emboli originate?", "back": "The proximal deep veins of the lower extremities (femoral, popliteal, iliac) \u2014 over 90% of cases."}, {"front": "What are the three components of Virchow's triad, and which two does pregnancy affect?", "back": "Endothelial injury, stasis, and hypercoagulability. Pregnancy causes both a hypercoagulable state (\u2191clotting factors, \u2193protein S) and venous stasis (uterine compression)."}, {"front": "What joint complication results from repeated untreated bleeding in hemophilia A, and what is the underlying deficiency?", "back": "Hemarthrosis (recurrent joint bleeding leading to chronic arthropathy), due to deficiency of clotting factor VIII."}, {"front": "What inheritance pattern does hemophilia A follow, and what family pattern suggests it?", "back": "X-linked recessive \u2014 affected males, carrier females who are usually asymptomatic, and transmission traceable through the maternal line (e.g., an affected maternal uncle)."}, {"front": "What does an elevated D-dimer indicate, and how specific is it?", "back": "It reflects fibrin degradation from active thrombus formation/breakdown (e.g., DVT, PE); it is sensitive but not specific, since it can be elevated in many other conditions (surgery, infection, pregnancy)."}]}, {"id": "immuno-vasculitis", "name": "Immunopathology, Vasculitis & Granulomatous Disease", "mcqs": [{"stem": "A 30-year-old woman develops sudden facial swelling, generalized urticaria, wheezing, and a blood pressure of 70/40 mmHg within 10 minutes of a bee sting. Which mast-cell mediator is primarily responsible for the acute bronchoconstriction and increased vascular permeability seen in this reaction?", "options": ["IL-2", "Histamine", "IFN-\u03b3", "IL-10"], "answer": 1, "explanation": "Preformed histamine released from mast cell/basophil granules mediates the immediate manifestations of type I hypersensitivity: bronchoconstriction, vasodilation, and increased vascular permeability."}, {"stem": "A 3-year-old girl has had fever for 6 days along with bilateral non-purulent conjunctival injection, a diffuse erythematous rash, swelling of the hands and feet, and cervical lymphadenopathy. If untreated, she is at greatest risk for which long-term complication?", "options": ["Coronary artery aneurysm", "Mitral valve stenosis", "Constrictive pericarditis", "Pulmonary hypertension"], "answer": 0, "explanation": "Kawasaki disease is a medium-vessel vasculitis of childhood whose most feared complication is coronary artery aneurysm, risking thrombosis or myocardial infarction."}, {"stem": "A 19-year-old college student presents with a two-week history of fever, severe fatigue, and tonsillar exudates. Examination reveals bilateral posterior cervical lymphadenopathy, and the heterophile antibody test is positive. A lymph node biopsy would most likely show expansion of which nodal region, reflecting a predominantly T-cell response?", "options": ["Follicular (B-cell) region", "Paracortical (T-cell) region", "Medullary sinuses only", "Subcapsular sinus only"], "answer": 1, "explanation": "EBV infects B cells, but the reactive lymphadenopathy of infectious mononucleosis is dominated by paracortical (T-zone) hyperplasia from the vigorous cytotoxic T-cell response to infected B cells."}, {"stem": "A 42-year-old woman presents with dry cough and exertional dyspnea. Chest CT shows bilateral hilar lymphadenopathy and reticular opacities in the upper lobes. Transbronchial biopsy shows non-caseating granulomas without acid-fast organisms. Which laboratory finding would best support the most likely diagnosis?", "options": ["Positive AFB smear", "Elevated serum ACE level and hypercalcemia", "Elevated anti-dsDNA antibodies", "Low serum ACE with hypocalcemia"], "answer": 1, "explanation": "Sarcoidosis classically shows elevated ACE (secreted by epithelioid granuloma cells) and hypercalcemia (from macrophage-mediated extra-renal activation of vitamin D)."}, {"stem": "A 68-year-old woman presents with a new throbbing headache on one side of the scalp, pain while chewing, and tenderness over the temple. She also reports a brief episode of painless vision loss that resolved within minutes. ESR is markedly elevated. Biopsy of the affected artery would most likely reveal which finding?", "options": ["Fibrinoid necrosis with an eosinophilic infiltrate in small vessels", "Granulomatous inflammation of the vessel wall with multinucleated giant cells", "Leukocytoclastic vasculitis with IgA deposition", "Necrotizing vasculitis of medium vessels with microaneurysms"], "answer": 1, "explanation": "Giant cell (temporal) arteritis shows granulomatous inflammation of medium/large arteries with giant cells and elastic lamina fragmentation, risking anterior ischemic optic neuropathy (transient or permanent vision loss)."}, {"stem": "A 42-year-old woman presents with symmetric swelling and morning stiffness lasting over an hour in the wrists and metacarpophalangeal joints for 8 months, improving with activity. Rheumatoid factor and anti-CCP antibodies are positive. Synovial biopsy would most likely show infiltration predominantly by which cells?", "options": ["Neutrophils and eosinophils", "Lymphocytes and plasma cells with a macrophage-lined pannus", "Basophils and mast cells", "Fibroblasts only, with no inflammatory infiltrate"], "answer": 1, "explanation": "Rheumatoid synovitis features a chronic inflammatory infiltrate of lymphocytes, plasma cells, and macrophages that forms a proliferative pannus eroding cartilage and bone."}, {"stem": "A 30-year-old healthcare worker develops chronic cough and low-grade fever for 6 weeks. Chest imaging shows a cavitary lesion in the right upper lobe, and sputum is smear-positive for acid-fast bacilli. A biopsy from an involved lymph node would most likely show granulomas composed of which cells, surrounding a center of caseous necrosis?", "options": ["Foreign-body giant cells and neutrophils only", "Touton giant cells and lipid-laden macrophages", "Langhans giant cells, epithelioid histiocytes, and lymphocytes", "Reed-Sternberg cells and eosinophils"], "answer": 2, "explanation": "Tuberculous granulomas are caseating and composed of epithelioid histiocytes, Langhans-type multinucleated giant cells (peripheral horseshoe-arranged nuclei), and a surrounding lymphocytic cuff."}], "flashcards": [{"front": "Which mast-cell mediator causes the immediate bronchoconstriction and hypotension of anaphylaxis, and is it preformed or newly synthesized?", "back": "Histamine \u2014 preformed and stored in mast cell/basophil granules, released within seconds of degranulation."}, {"front": "What is the most feared complication of Kawasaki disease, and why does it matter long-term?", "back": "Coronary artery aneurysm, which predisposes to thrombosis, myocardial infarction, or rupture \u2014 the reason IVIG is given early to reduce this risk."}, {"front": "Which nodal compartment expands in EBV/infectious mononucleosis lymphadenopathy, and why?", "back": "The paracortex (T-cell zone) \u2014 because the dominant reactive process is a cytotoxic T-cell response against EBV-infected B cells, not a B-cell (follicular) proliferation."}, {"front": "What two lab findings classically support a diagnosis of sarcoidosis in the setting of non-caseating granulomas?", "back": "Elevated serum ACE (from granuloma epithelioid cells) and hypercalcemia (macrophage-driven extra-renal vitamin D activation)."}, {"front": "What is the classic histologic finding in giant cell (temporal) arteritis, and what vision complication can result?", "back": "Granulomatous inflammation of the arterial wall with multinucleated giant cells and fragmentation of the internal elastic lamina; can cause anterior ischemic optic neuropathy and sudden vision loss."}, {"front": "What cells infiltrate the synovium in rheumatoid arthritis, and what structure do they form that erodes joints?", "back": "Lymphocytes, plasma cells, and macrophages, forming a proliferative pannus that erodes articular cartilage and bone."}, {"front": "What three cell types make up a caseating (tuberculous) granuloma?", "back": "Epithelioid histiocytes, Langhans giant cells (peripheral horseshoe nuclei), and a surrounding lymphocyte cuff, with central caseous necrosis."}]}, {"id": "neoplasia-general", "name": "Neoplasia: General Mechanisms & Paraneoplastic Syndromes", "mcqs": [{"stem": "A 58-year-old woman presents with abdominal distension and early satiety. Imaging reveals a large ovarian mass along with innumerable small nodules studding the peritoneal surfaces and omentum, with malignant cells confirmed on paracentesis. Which mechanism best explains this pattern of spread?", "options": ["Hematogenous spread via the portal circulation", "Direct seeding across a body cavity", "Lymphatic embolization to para-aortic nodes", "Perineural invasion along peritoneal nerves"], "answer": 1, "explanation": "Ovarian carcinoma classically spreads by transcoelomic (direct) seeding of tumor cells shed into the peritoneal cavity."}, {"stem": "A 58-year-old man with a 45-pack-year smoking history presents with confusion, constipation, and polyuria. Serum calcium is markedly elevated with a low PTH level. Chest CT reveals a 6-cm centrally located lung mass. Which histologic type of lung cancer is most likely responsible?", "options": ["Adenocarcinoma", "Small cell carcinoma", "Squamous cell carcinoma", "Large cell carcinoma"], "answer": 2, "explanation": "Squamous cell carcinoma of the lung classically secretes PTHrP, causing humoral hypercalcemia of malignancy with a suppressed PTH level."}, {"stem": "A 50-year-old woman has a firm, mobile breast lump. Core biopsy shows glandular epithelial proliferation with mild nuclear atypia confined within an intact myoepithelial layer and basement membrane. Which additional histologic finding would most strongly indicate this lesion has become invasive carcinoma?", "options": ["Increased stromal cellularity without atypia", "Tumor cells breaching the basement membrane and infiltrating stroma", "Uniform nuclei with low mitotic count", "A well-circumscribed pushing border"], "answer": 1, "explanation": "The hallmark distinguishing in-situ from invasive carcinoma is penetration of the basement membrane with infiltration into surrounding stroma, conferring metastatic potential."}, {"stem": "A patient with metastatic colorectal cancer is found to have a KRAS mutation causing constitutive activation of the RAS-MAPK signaling pathway independent of upstream receptor activation. Which hallmark of cancer is most directly enabled by this molecular alteration?", "options": ["Evading growth suppressors", "Sustaining proliferative signaling", "Resisting cell death", "Inducing angiogenesis"], "answer": 1, "explanation": "Constitutive, receptor-independent activation of a proliferative signaling pathway directly sustains proliferative signaling, a core hallmark of cancer."}], "flashcards": [{"front": "What is 'transcoelomic seeding' and which tumor is the classic example?", "back": "Direct spread of tumor cells across a body cavity (e.g., peritoneum), where they implant on serosal surfaces; ovarian carcinoma is the classic example, producing peritoneal studding and malignant ascites."}, {"front": "Which lung cancer subtype causes paraneoplastic hypercalcemia, and by what mechanism?", "back": "Squamous cell carcinoma, via secretion of PTHrP (parathyroid hormone-related peptide), which mimics PTH action but suppresses endogenous PTH."}, {"front": "What single histologic feature distinguishes carcinoma in situ from invasive carcinoma?", "back": "Breach of the basement membrane with invasion of tumor cells into the surrounding stroma \u2014 the point at which metastatic potential begins."}, {"front": "A mutation that keeps a proliferative signaling pathway constitutively 'on' (e.g., KRAS) exemplifies which hallmark of cancer?", "back": "Sustaining proliferative signaling \u2014 the cell no longer needs external growth factor stimulation to keep dividing."}]}, {"id": "cvs-ischemic", "name": "Cardiovascular Pathology I: Ischemic & Hypertensive Heart Disease", "mcqs": [{"stem": "A 70-year-old man with long-standing tricuspid regurgitation presents with progressive abdominal distension, bilateral leg swelling, and elevated jugular venous pressure. Liver function tests are mildly deranged. Which histologic finding is most likely on liver biopsy?", "options": ["Micronodular cirrhosis", "Macrovesicular steatosis", "Centrilobular congestion and hemorrhagic necrosis", "Granulomatous inflammation"], "answer": 2, "explanation": "Right-sided heart failure causes hepatic venous congestion, most pronounced around the central vein ('nutmeg liver'), which can progress to centrilobular hemorrhagic necrosis in severe or chronic cases."}, {"stem": "A 62-year-old man with long-standing hyperlipidemia and hypertension develops crushing substernal chest pain radiating to the left arm while shoveling snow, with diaphoresis. ECG shows ST-segment elevation in the anterior leads, and troponin is markedly elevated. Which is the most likely immediate precipitating event?", "options": ["Fixed, stable atherosclerotic stenosis", "Rupture of an atherosclerotic plaque with superimposed acute thrombosis", "Spontaneous coronary artery dissection unrelated to atherosclerosis", "Coronary vasospasm alone, without plaque disruption"], "answer": 1, "explanation": "Acute STEMI is most commonly caused by rupture or erosion of an unstable atherosclerotic plaque, triggering acute thrombus formation and vessel occlusion."}, {"stem": "A 72-year-old woman with 20 years of poorly controlled hypertension presents with progressive exertional dyspnea and orthopnea. Examination reveals bibasilar crackles, and echocardiogram shows a thickened, hypertrophied left ventricle with preserved ejection fraction. Chest x-ray shows pulmonary vascular congestion. Which condition has most likely produced these findings?", "options": ["Centrilobular emphysema", "Long-standing systemic hypertension", "Tricuspid regurgitation", "Chronic alcohol use"], "answer": 1, "explanation": "Chronic pressure overload from systemic hypertension causes concentric LV hypertrophy, leading to diastolic dysfunction, elevated filling pressures, and pulmonary congestion (heart failure with preserved ejection fraction)."}, {"stem": "A 65-year-old woman had an anterior myocardial infarction 6 days ago. She suddenly develops severe chest pain and rapidly progressive hypotension, and dies despite resuscitation. Autopsy reveals the pericardial sac distended with blood. What is the most likely cause of death?", "options": ["Fibrinous pericarditis", "Papillary muscle rupture", "Rupture of the left ventricular free wall", "Ventricular aneurysm formation"], "answer": 2, "explanation": "Free wall rupture typically occurs 3\u20137 days post-MI, when the infarct is weakest during macrophage-mediated clearance of necrotic tissue; it leads to hemopericardium, cardiac tamponade, and sudden death."}], "flashcards": [{"front": "What histologic change occurs in the liver in chronic right-sided heart failure, and what does it look like grossly?", "back": "Centrilobular congestion progressing to hemorrhagic necrosis around the central vein \u2014 grossly called a 'nutmeg liver' due to alternating red (congested) and pale (less-involved) areas."}, {"front": "What is the immediate trigger of most ST-elevation myocardial infarctions?", "back": "Rupture or erosion of an unstable atherosclerotic plaque with superimposed acute thrombus formation occluding the coronary artery."}, {"front": "Why does chronic systemic hypertension cause heart failure with preserved ejection fraction (HFpEF)?", "back": "Concentric LV hypertrophy from chronic pressure overload stiffens the ventricle, impairing diastolic filling and raising filling pressures, even though systolic (ejection) function is preserved."}, {"front": "When is the risk of left ventricular free wall rupture highest after a myocardial infarction, and what is the consequence?", "back": "Around days 3\u20137 post-MI, when the infarct is softest (macrophage clearance phase, before collagen strengthens it); rupture causes hemopericardium and fatal cardiac tamponade."}]}, {"id": "cvs-valvular", "name": "Cardiovascular Pathology II: Valvular, Congenital, Cardiomyopathic & Vascular Disease", "mcqs": [{"stem": "A 32-year-old man with a history of intravenous drug use presents with fever, chills, and a new murmur best heard at the left lower sternal border that increases with inspiration. Blood cultures grow Staphylococcus aureus. Echocardiography shows a mobile mass attached to a right-sided valve. What is the pathological composition of this mass?", "options": ["Sterile platelet-fibrin thrombus", "Organized thrombus covered by endothelium", "Friable vegetation composed of fibrin, platelets, and trapped bacteria", "Calcified nodule with no organisms"], "answer": 2, "explanation": "Infective endocarditis vegetations are friable aggregates of fibrin, platelets, inflammatory cells, and colonizing organisms; IV drug use predisposes to right-sided (tricuspid) valve involvement."}, {"stem": "A 38-year-old man presents to the emergency department with severe headache and blurred vision. Blood pressure is 225/140 mmHg. Fundoscopy shows papilledema and flame hemorrhages. Renal biopsy shows concentric 'onion-skin' thickening of small arterioles with luminal narrowing. What is the vascular lesion described?", "options": ["Hyaline arteriolosclerosis", "Atherosclerosis of large arteries", "Hyperplastic arteriolosclerosis", "Granulomatous vasculitis"], "answer": 2, "explanation": "Malignant hypertension causes hyperplastic arteriolosclerosis \u2014 concentric ('onion-skin') smooth-muscle proliferation of arteriolar walls \u2014 distinct from the hyaline arteriolosclerosis of benign hypertension/diabetes."}, {"stem": "A 22-year-old competitive athlete collapses suddenly during a marathon and cannot be resuscitated. His father died suddenly at age 35. Autopsy shows marked thinning and fatty-fibrous replacement of the right ventricular free wall, with minimal inflammatory infiltrate. Which condition best explains these findings?", "options": ["Dilated cardiomyopathy", "Hypertrophic cardiomyopathy", "Restrictive cardiomyopathy", "Arrhythmogenic right ventricular cardiomyopathy"], "answer": 3, "explanation": "ARVC is an inherited desmosomal gene disorder causing progressive fibrofatty replacement of RV myocardium, predisposing to ventricular arrhythmias and sudden cardiac death, especially during exertion."}, {"stem": "A 6-month-old infant is found to have a continuous, machine-like murmur heard best at the left infraclavicular area during a routine well-child visit. She is otherwise thriving. Echocardiography confirms a persistent connection between the aorta and pulmonary artery. Which congenital cardiac anomaly is described?", "options": ["Ventricular septal defect", "Tetralogy of Fallot", "Patent ductus arteriosus", "Coarctation of the aorta"], "answer": 2, "explanation": "PDA produces a continuous 'machinery' murmur from persistent left-to-right shunting between the aorta and pulmonary artery throughout systole and diastole."}, {"stem": "A 17-year-old basketball player collapses suddenly during practice and dies. His uncle had a similar sudden death at age 28. Autopsy reveals asymmetric thickening of the interventricular septum with myocyte disarray on histology. Which category of gene mutation most commonly underlies this condition?", "options": ["Mutation in a desmosomal protein gene", "Mutation in a sarcomeric protein gene (e.g., \u03b2-myosin heavy chain)", "Mutation in the lamin A/C gene", "Mutation in a mitochondrial DNA gene"], "answer": 1, "explanation": "Hypertrophic cardiomyopathy is most commonly caused by autosomal dominant mutations in sarcomeric protein genes (\u03b2-myosin heavy chain, myosin-binding protein C), producing myocyte disarray and asymmetric septal hypertrophy."}, {"stem": "A newborn develops severe central cyanosis within the first day of life that does not improve significantly with supplemental oxygen. Echocardiography shows the aorta arising anteriorly from the right ventricle and the pulmonary artery arising from the left ventricle, with the two great vessels running in parallel. Which congenital anomaly is this?", "options": ["Tetralogy of Fallot", "Truncus arteriosus", "Total anomalous pulmonary venous return", "Transposition of the great arteries"], "answer": 3, "explanation": "Transposition of the great arteries produces ventriculoarterial discordance, creating two parallel (rather than connected) circulations and severe cyanosis at birth unless a shunt allows mixing."}, {"stem": "A 70-year-old man with a long smoking history presents with vague abdominal and back discomfort. On examination, a pulsatile, non-tender periumbilical mass is palpated. Ultrasound reveals a 6-cm fusiform dilation of the infrarenal aorta involving all three layers of the vessel wall. What is the most likely diagnosis?", "options": ["Aortic dissection", "Abdominal aortic aneurysm", "Aortic coarctation", "Takayasu arteritis"], "answer": 1, "explanation": "A true aneurysm (fusiform dilation involving all three vessel wall layers) is characteristic of an atherosclerotic abdominal aortic aneurysm, strongly linked to smoking and hypertension."}, {"stem": "An 11-year-old boy develops fever, migratory polyarthritis, and a new holosystolic murmur three weeks after untreated streptococcal pharyngitis. Anti-streptolysin O titers are elevated, and he meets criteria for acute rheumatic fever. He recovers, but which cardiac valvular complication is he at greatest long-term risk of developing decades later?", "options": ["Aortic regurgitation only", "Mitral stenosis", "Tricuspid atresia", "Pulmonary valve stenosis"], "answer": 1, "explanation": "Recurrent or chronic rheumatic carditis leads to progressive fibrosis and fusion of the mitral valve leaflets and chordae, producing the classic 'fish-mouth' mitral stenosis over years to decades."}], "flashcards": [{"front": "What is the composition of an infective endocarditis vegetation, and why does IV drug use favor right-sided valves?", "back": "Friable aggregates of fibrin, platelets, inflammatory cells, and colonizing organisms; IV drug use seeds bacteria directly into the venous system, which reaches the tricuspid valve first."}, {"front": "What vascular lesion is seen in malignant hypertension, and how does it differ from the lesion of benign hypertension?", "back": "Hyperplastic arteriolosclerosis \u2014 concentric 'onion-skin' smooth-muscle proliferation with luminal narrowing. Benign hypertension instead produces hyaline arteriolosclerosis (homogeneous pink hyaline thickening)."}, {"front": "What is the genetic/histologic basis of arrhythmogenic right ventricular cardiomyopathy (ARVC), and why is it dangerous in athletes?", "back": "Inherited desmosomal protein mutations cause progressive fibrofatty replacement of RV myocardium, predisposing to ventricular arrhythmias and sudden death, often triggered by exertion."}, {"front": "What murmur is classic for patent ductus arteriosus, and why?", "back": "A continuous 'machinery' murmur, because the left-to-right shunt between the (higher-pressure) aorta and pulmonary artery persists throughout both systole and diastole."}, {"front": "What gene category is most commonly mutated in hypertrophic cardiomyopathy, and what is the classic histologic finding?", "back": "Sarcomeric protein genes (e.g., \u03b2-myosin heavy chain); histology shows myocyte disarray with asymmetric septal hypertrophy."}, {"front": "What defines transposition of the great arteries anatomically, and why is it incompatible with life without a shunt?", "back": "Ventriculoarterial discordance \u2014 aorta from the right ventricle, pulmonary artery from the left ventricle \u2014 creating two parallel circulations; a shunt (PDA/ASD/VSD) is needed to allow mixing of oxygenated and deoxygenated blood."}, {"front": "What distinguishes a true aneurysm from a dissection, and what is the classic risk factor profile for an AAA?", "back": "A true aneurysm (like AAA) is a fusiform/saccular dilation involving all three layers of the vessel wall; a dissection is a tear allowing blood to track between the wall layers. AAA is strongly linked to smoking, atherosclerosis, and hypertension."}, {"front": "What is the long-term valvular consequence of rheumatic fever, and what is its classic gross appearance?", "back": "Chronic rheumatic heart disease causes fibrous fusion and thickening of the mitral valve leaflets and chordae, producing 'fish-mouth' or 'buttonhole' mitral stenosis."}]}, {"id": "respiratory", "name": "Respiratory Pathology", "mcqs": [{"stem": "A 58-year-old man with a 35-pack-year smoking history has a productive cough on most days over the last 3 years. Which histopathologic finding in his airways is most characteristic of his underlying disease?", "options": ["Destruction of alveolar septa with airspace enlargement", "Hyperplasia of bronchial submucosal mucus glands and goblet cells", "Diffuse alveolar damage with hyaline membranes", "Non-caseating granulomas in bronchial walls"], "answer": 1, "explanation": "Chronic bronchitis (productive cough \u22653 months for 2 consecutive years) is defined pathologically by hyperplasia of submucosal mucous glands (increased Reid index) and goblet cell hyperplasia."}, {"stem": "A 34-year-old woman with a connective tissue disease develops progressive exertional dyspnea and syncope. Right heart catheterization confirms severe pulmonary arterial hypertension. Lung biopsy in advanced disease would most likely show which vascular lesion?", "options": ["Caseating granulomas in vessel walls", "Plexiform arterial lesions", "Fibrinoid necrosis of alveolar capillaries only", "Hyaline membranes lining alveoli"], "answer": 1, "explanation": "Advanced pulmonary arterial hypertension is characterized by plexiform lesions \u2014 complex vascular proliferations arising from endothelial and smooth-muscle proliferation in small pulmonary arteries."}, {"stem": "A 19-year-old woman with a long history of poorly controlled asthma dies during a severe exacerbation. Autopsy shows overdistended airspaces, and microscopy shows bronchi markedly narrowed by thick mucus plugs and smooth muscle hypertrophy. Which of the following best describes these airway changes?", "options": ["Destruction of alveolar walls with permanent airspace enlargement", "Airways narrowed by mucus plugging and thickened bronchial walls", "Diffuse alveolar damage with hyaline membrane formation", "Non-caseating granulomas obstructing bronchioles"], "answer": 1, "explanation": "Fatal status asthmaticus shows hyperinflated lungs with bronchi occluded by thick mucus plugs, goblet cell hyperplasia, smooth muscle hypertrophy, and basement membrane thickening."}, {"stem": "A 70-year-old man with a 50-pack-year smoking history and a long-standing productive cough presents with progressively worsening leg swelling, distended neck veins, and a right ventricular heave. Which mechanism best links his lung disease to these new cardiac findings?", "options": ["Left-sided heart failure from hypertension", "Cor pulmonale from chronic pulmonary hypertension", "Idiopathic dilated cardiomyopathy", "Constrictive pericarditis"], "answer": 1, "explanation": "Chronic hypoxic pulmonary vasoconstriction from COPD leads to pulmonary hypertension and secondary right ventricular hypertrophy/failure \u2014 cor pulmonale."}, {"stem": "A 62-year-old former shipyard worker presents with progressive dyspnea and dry cough after decades of occupational exposure. Chest imaging shows bilateral lower-lobe interstitial fibrosis and pleural plaques. Lung biopsy would most characteristically show which additional finding?", "options": ["Golden-brown, iron-encrusted rod-shaped bodies (ferruginous bodies)", "'Eggshell' calcification of hilar nodes", "Non-caseating granulomas", "Anthracotic pigment without fibrosis"], "answer": 0, "explanation": "Asbestos fibers coated with iron-protein complexes form characteristic ferruginous bodies on lung biopsy, along with pleural plaques and lower-lobe-predominant fibrosis."}], "flashcards": [{"front": "What histologic/quantitative finding defines chronic bronchitis, and what clinical definition accompanies it?", "back": "Hyperplasia of bronchial submucosal mucous glands (increased Reid index) and goblet cell hyperplasia; clinically defined as a productive cough for \u22653 months in 2 consecutive years."}, {"front": "What vascular lesion characterizes advanced pulmonary arterial hypertension?", "back": "Plexiform lesions \u2014 complex proliferations of endothelial and smooth-muscle cells within small pulmonary arteries."}, {"front": "What airway changes are seen at autopsy in fatal status asthmaticus?", "back": "Hyperinflated lungs with bronchi occluded by thick mucus plugs, goblet cell hyperplasia, bronchial smooth-muscle hypertrophy, and basement-membrane thickening."}, {"front": "What is cor pulmonale, and what is its usual cause in a patient with COPD?", "back": "Right ventricular hypertrophy/failure secondary to pulmonary hypertension, driven in COPD by chronic hypoxic pulmonary vasoconstriction."}, {"front": "What histologic clue on lung biopsy points specifically to asbestos exposure?", "back": "Ferruginous bodies \u2014 asbestos fibers coated with iron-protein complexes \u2014 typically accompanied by pleural plaques and lower-lobe interstitial fibrosis."}]}, {"id": "rbc-disorders", "name": "Hematology: RBC Disorders", "mcqs": [{"stem": "A 26-year-old man of Mediterranean descent develops acute fatigue, dark urine, and jaundice three days after starting dapsone for a skin infection. Peripheral smear shows bite cells and Heinz bodies. Which mechanism best explains the red cell damage in this patient?", "options": ["IgG-mediated extravascular hemolysis", "Oxidative damage to hemoglobin and RBC membranes from an enzyme deficiency", "Complement-mediated intravascular lysis from a membrane defect", "Mechanical shearing of RBCs in the microvasculature"], "answer": 1, "explanation": "G6PD deficiency impairs the RBC's ability to neutralize oxidative stress from certain drugs (dapsone, primaquine, sulfa drugs), causing hemoglobin denaturation (Heinz bodies) and membrane damage (bite cells) as splenic macrophages remove the damaged portions."}, {"stem": "A 24-year-old previously healthy man loses approximately 1.5 liters of blood after a motor vehicle accident and receives an emergency transfusion. His hemoglobin subsequently stabilizes. A peripheral smear obtained 4 days later would most likely show which finding, reflecting the bone marrow's response?", "options": ["Schistocytes", "Target cells", "Increased reticulocytes (polychromatophilic cells)", "Basophilic stippling"], "answer": 2, "explanation": "After acute blood loss, the bone marrow responds within 3\u20135 days by releasing increased numbers of reticulocytes (immature, polychromatophilic RBCs) to compensate for the loss."}, {"stem": "A 24-year-old man develops jaundice and dark-colored urine two days after starting an antimalarial medication for travel prophylaxis. Hemoglobin is 8 g/dL, and peripheral smear shows bite cells and Heinz bodies with elevated indirect bilirubin and LDH. What is the underlying pathophysiologic defect?", "options": ["Structural abnormality of the RBC membrane cytoskeleton", "Reduced synthesis of one globin chain", "Deficiency of an enzyme protecting RBCs from oxidative stress", "A point mutation causing abnormal hemoglobin polymerization"], "answer": 2, "explanation": "G6PD deficiency results in reduced NADPH/glutathione, impairing the RBC's ability to detoxify oxidative stressors such as antimalarials, leading to hemolysis."}], "flashcards": [{"front": "What is the mechanism of hemolysis in G6PD deficiency, and what two peripheral smear findings are classic?", "back": "Reduced NADPH/glutathione impairs defense against oxidative stress, causing hemoglobin denaturation and membrane damage after exposure to oxidant drugs (antimalarials, dapsone, sulfa drugs, fava beans); smear shows bite cells and Heinz bodies."}, {"front": "How quickly does the bone marrow respond to acute blood loss, and what peripheral smear finding reflects this response?", "back": "Within about 3\u20135 days, with a rise in reticulocytes (large, polychromatophilic cells) as the marrow ramps up RBC production."}]}, {"id": "heme-malignancy", "name": "Hematology: Leukemia & Lymphoma", "mcqs": [{"stem": "A 28-year-old man presents with painless, non-tender cervical lymphadenopathy and drenching night sweats for 2 months. Excisional biopsy shows a background of reactive lymphocytes, eosinophils, and plasma cells admixed with rare large cells containing two mirror-image nuclei, each with a prominent eosinophilic nucleolus. What is this diagnostic malignant cell called?", "options": ["Reed-Sternberg cell", "Lymphoblast", "S\u00e9zary cell", "Popcorn cell"], "answer": 0, "explanation": "Classic Hodgkin lymphoma is characterized by rare Reed-Sternberg cells (binucleate, 'owl-eye' nucleoli) within a reactive inflammatory background."}, {"stem": "A 68-year-old woman presents with fatigue, bone pain, and recurrent pneumonia. Labs show anemia, elevated serum creatinine, and markedly elevated total protein with a monoclonal spike on serum protein electrophoresis. Skeletal survey shows multiple lytic lesions in the vertebrae and skull. Bone marrow biopsy would most likely show which finding?", "options": ["Sheets of lymphoblasts with a high N:C ratio", "Diffuse infiltration by clonal plasma cells", "Granulomas with caseous necrosis", "Fibrosis with markedly reduced cellularity"], "answer": 1, "explanation": "Multiple myeloma is a clonal plasma cell neoplasm infiltrating the bone marrow, producing a monoclonal immunoglobulin (M-spike), lytic bone lesions, hypercalcemia, and renal impairment."}, {"stem": "A 5-year-old girl presents with fatigue, easy bruising, and fever. Bone marrow aspirate shows >25% blasts positive for CD10, CD19, and a nuclear enzyme marker typically expressed in lymphoid precursors. Which finding would most strongly support a diagnosis of acute lymphoblastic leukemia over acute myeloid leukemia?", "options": ["Presence of Auer rods", "Terminal deoxynucleotidyl transferase (TdT) positivity", "Myeloperoxidase (MPO) positivity", "t(15;17) translocation"], "answer": 1, "explanation": "TdT, a DNA polymerase expressed in immature lymphoid precursor cells, is positive in ALL (both B- and T-lineage) but not AML; Auer rods, MPO positivity, and t(15;17) are specific for AML (particularly acute promyelocytic leukemia)."}, {"stem": "A 74-year-old man is found to have an elevated lymphocyte count on routine bloodwork. Peripheral smear shows numerous small, mature-appearing lymphocytes and frequent smudge cells. Flow cytometry confirms a CD5+, CD23+ B-cell clone. He subsequently develops recurrent sinopulmonary infections. What is the most likely explanation for his susceptibility to infection?", "options": ["Autoimmune destruction of neutrophils", "Hypogammaglobulinemia due to impaired antibody production by dysfunctional clonal B cells", "Direct bone marrow destruction by leukemic infiltration causing neutropenia", "Complement deficiency secondary to hemolysis"], "answer": 1, "explanation": "CLL cells are functionally incompetent, leading to hypogammaglobulinemia and increased susceptibility to bacterial infection, a major cause of morbidity in CLL."}, {"stem": "A 6-year-old boy in a malaria-endemic region presents with a rapidly growing mass involving the mandible. Biopsy shows sheets of medium-sized, monomorphic lymphoid cells with numerous mitotic figures, interspersed with pale-staining macrophages that have ingested apoptotic debris, creating a 'starry-sky' appearance. Which is the most likely diagnosis?", "options": ["Follicular lymphoma", "Diffuse large B-cell lymphoma", "Burkitt lymphoma", "Mantle cell lymphoma"], "answer": 2, "explanation": "Burkitt lymphoma (associated with EBV and a MYC translocation in endemic cases) classically presents as jaw masses in children with a 'starry-sky' pattern from tingible-body macrophages amid an extremely high proliferation-rate tumor."}, {"stem": "A 50-year-old man presents with fatigue, early satiety, and a palpable spleen tip 10 cm below the costal margin. CBC shows a markedly elevated WBC count with a full spectrum of granulocyte maturation (myelocytes to mature neutrophils) and basophilia. Leukocyte alkaline phosphatase (LAP) score is low, and cytogenetics reveals a BCR-ABL1 fusion. What is the most likely diagnosis?", "options": ["Chronic myeloid leukemia", "Leukemoid reaction", "Acute myeloid leukemia", "Polycythemia vera"], "answer": 0, "explanation": "CML is characterized by BCR-ABL1 (Philadelphia chromosome) fusion, marked leukocytosis with a full maturation spectrum, basophilia, a low LAP score (distinguishing it from a reactive leukemoid reaction, which has a high LAP score), and massive splenomegaly."}], "flashcards": [{"front": "What cell defines classic Hodgkin lymphoma morphologically, and what does it look like?", "back": "The Reed-Sternberg cell \u2014 a large cell with two mirror-image nuclei, each containing a prominent eosinophilic ('owl-eye') nucleolus, set in a reactive inflammatory background."}, {"front": "What four features define multiple myeloma (the 'CRAB' criteria in brief)?", "back": "Hypercalcemia, Renal insufficiency, Anemia, and lytic Bone lesions, driven by diffuse bone marrow infiltration by a clonal plasma cell population secreting monoclonal immunoglobulin."}, {"front": "Which marker distinguishes ALL from AML on immunophenotyping, and what does it reflect?", "back": "TdT (terminal deoxynucleotidyl transferase) positivity \u2014 reflects a lymphoid precursor lineage; it is absent in AML, which instead may show MPO positivity or Auer rods."}, {"front": "Why do CLL patients get recurrent infections despite a very high lymphocyte count?", "back": "The clonal B cells are functionally incompetent at producing antibodies, causing hypogammaglobulinemia despite the high total lymphocyte count."}, {"front": "What is the 'starry-sky' pattern, and in which lymphoma is it classic?", "back": "Pale tingible-body macrophages (that have phagocytosed apoptotic debris) scattered among sheets of rapidly dividing lymphoma cells; classic for Burkitt lymphoma, associated with MYC translocation."}, {"front": "What lab test distinguishes CML from a benign leukemoid reaction when both show marked leukocytosis?", "back": "Leukocyte alkaline phosphatase (LAP) score \u2014 low in CML, high in a reactive leukemoid reaction; CML is confirmed by BCR-ABL1 (Philadelphia chromosome)."}]}, {"id": "gi-hepatobiliary", "name": "GI & Hepatobiliary Pathology", "mcqs": [{"stem": "A 48-year-old man with a long history of heavy alcohol use presents with right upper quadrant discomfort and mild jaundice. Liver biopsy shows hepatocytes distended with large, clear cytoplasmic droplets that displace the nucleus to the periphery. Which mechanism best explains this hepatocyte change?", "options": ["Increased mitochondrial oxidative damage from reactive oxygen species alone", "Decreased hepatic beta-oxidation of fatty acids, leading to intracellular triglyceride accumulation", "Impaired lysosomal degradation of glycogen", "Defective bile canalicular transport"], "answer": 1, "explanation": "Alcohol metabolism shifts hepatocyte redox state and impairs mitochondrial beta-oxidation of fatty acids, promoting triglyceride accumulation as macrovesicular steatosis."}, {"stem": "A 60-year-old man with a 15-year history of heartburn undergoes upper endoscopy, which shows salmon-colored, velvety mucosa extending proximally from the gastroesophageal junction, contrasting with the normal pale, glistening squamous mucosa above it. Which histologic change in the distal esophageal mucosa best explains this endoscopic appearance?", "options": ["Squamous cell dysplasia", "Replacement of squamous epithelium by intestinal-type columnar epithelium", "Simple squamous hyperplasia without metaplasia", "Granulation tissue formation"], "answer": 1, "explanation": "Barrett esophagus is metaplastic replacement of the normal stratified squamous epithelium by intestinal-type columnar epithelium (with goblet cells) due to chronic acid reflux \u2014 a precursor lesion for esophageal adenocarcinoma."}], "flashcards": [{"front": "What is the mechanism of alcoholic fatty liver (macrovesicular steatosis)?", "back": "Alcohol metabolism impairs mitochondrial beta-oxidation of fatty acids and alters hepatocyte redox state, promoting intracellular triglyceride accumulation."}, {"front": "What is Barrett esophagus, what causes it, and why is it clinically important?", "back": "Metaplastic replacement of esophageal squamous epithelium by intestinal-type columnar epithelium (with goblet cells), caused by chronic GERD; it is a precursor lesion for esophageal adenocarcinoma."}]}];
</script>
<script>
(function(){
  // ---------- State ----------
  let mode = 'flash';           // 'flash' | 'quiz'
  let selectedTopicId = 'all';  // 'all' or topic id
  let flashIndex = 0;
  let flashDeck = [];
  let flashFlipped = false;

  let quizDeck = [];
  let quizIndex = 0;
  let quizAnswered = false;
  let quizScore = 0;
  let quizResults = []; // {topic, correct}
  let quizStarted = false;

  const mainArea = document.getElementById('mainArea');
  const topicListEl = document.getElementById('topicList');
  const modeFlashBtn = document.getElementById('modeFlashBtn');
  const modeQuizBtn = document.getElementById('modeQuizBtn');

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function topicById(id){ return TOPICS.find(t=>t.id===id); }

  function totalCount(kind){
    return TOPICS.reduce((s,t)=>s+t[kind].length,0);
  }

  function buildSidebar(){
    topicListEl.innerHTML = '';
    const allLi = document.createElement('li');
    const allBtn = document.createElement('button');
    allBtn.className = 'topic-btn' + (selectedTopicId==='all' ? ' active':'');
    const kind = mode==='flash' ? 'flashcards' : 'mcqs';
    allBtn.innerHTML = `<span>All Topics</span><span class="topic-count">${totalCount(kind)}</span>`;
    allBtn.onclick = () => { selectedTopicId='all'; onTopicChange(); };
    allLi.appendChild(allBtn);
    topicListEl.appendChild(allLi);

    TOPICS.forEach(t=>{
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.className = 'topic-btn' + (selectedTopicId===t.id ? ' active':'');
      btn.innerHTML = `<span>${t.name}</span><span class="topic-count">${t[kind].length}</span>`;
      btn.onclick = () => { selectedTopicId=t.id; onTopicChange(); };
      li.appendChild(btn);
      topicListEl.appendChild(li);
    });
  }

  function onTopicChange(){
    if(mode==='flash'){ setupFlashDeck(); renderFlash(); }
    else { setupQuizDeck(); renderQuiz(); }
    buildSidebar();
  }

  // ---------- Flashcards ----------
  function setupFlashDeck(){
    let cards = [];
    if(selectedTopicId==='all'){
      TOPICS.forEach(t=> t.flashcards.forEach(c=> cards.push({...c, topic:t.name})));
    } else {
      const t = topicById(selectedTopicId);
      cards = t.flashcards.map(c=>({...c, topic:t.name}));
    }
    flashDeck = cards;
    flashIndex = 0;
    flashFlipped = false;
  }

  function renderFlash(){
    if(flashDeck.length===0){
      mainArea.innerHTML = emptyState('No flashcards in this topic yet.');
      return;
    }
    const card = flashDeck[flashIndex];
    mainArea.innerHTML = `
      <div class="header-row">
        <div>
          <h1>Flashcards</h1>
          <p>${selectedTopicId==='all' ? 'All topics' : topicById(selectedTopicId).name} · tap the card to flip</p>
        </div>
        <div class="score-pill">Card <b>${flashIndex+1}</b> of <b>${flashDeck.length}</b></div>
      </div>

      <div class="card-stage">
        <div class="flashcard ${flashFlipped?'flipped':''}" id="flashcardEl">
          <div class="face face-front">
            <div class="face-label">${card.topic}</div>
            <div class="face-text">${card.front}</div>
            <div class="face-hint">Tap to reveal answer →</div>
          </div>
          <div class="face face-back">
            <div class="face-label">Answer</div>
            <div class="face-text">${card.back}</div>
            <div class="face-hint">← Tap to flip back</div>
          </div>
        </div>
      </div>

      <div class="card-nav">
        <div class="card-nav-left">
          <button class="btn" id="prevBtn" ${flashIndex===0?'disabled':''}>← Previous</button>
          <button class="btn" id="shuffleBtn">🔀 Shuffle</button>
        </div>
        <div class="card-nav-right">
          <button class="btn primary" id="nextBtn">${flashIndex===flashDeck.length-1 ? 'Restart deck' : 'Next →'}</button>
        </div>
      </div>
    `;
    document.getElementById('flashcardEl').onclick = ()=>{
      flashFlipped = !flashFlipped;
      document.getElementById('flashcardEl').classList.toggle('flipped', flashFlipped);
    };
    document.getElementById('prevBtn').onclick = ()=>{
      if(flashIndex>0){ flashIndex--; flashFlipped=false; renderFlash(); }
    };
    document.getElementById('nextBtn').onclick = ()=>{
      if(flashIndex<flashDeck.length-1){ flashIndex++; }
      else { flashIndex = 0; }
      flashFlipped=false; renderFlash();
    };
    document.getElementById('shuffleBtn').onclick = ()=>{
      flashDeck = shuffle(flashDeck);
      flashIndex = 0; flashFlipped=false; renderFlash();
    };
  }

  // ---------- Quiz ----------
  function setupQuizDeck(){
    let qs = [];
    if(selectedTopicId==='all'){
      TOPICS.forEach(t=> t.mcqs.forEach(q=> qs.push({...q, topic:t.name})));
      qs = shuffle(qs);
    } else {
      const t = topicById(selectedTopicId);
      qs = t.mcqs.map(q=>({...q, topic:t.name}));
    }
    quizDeck = qs;
    quizIndex = 0;
    quizAnswered = false;
    quizScore = 0;
    quizResults = [];
    quizStarted = quizDeck.length>0;
  }

  function renderQuiz(){
    if(quizDeck.length===0){
      mainArea.innerHTML = emptyState('No MCQs in this topic yet.');
      return;
    }
    if(quizIndex >= quizDeck.length){
      renderSummary();
      return;
    }
    const q = quizDeck[quizIndex];
    const letters = ['A','B','C','D'];
    mainArea.innerHTML = `
      <div class="header-row">
        <div>
          <h1>MCQ Quiz</h1>
          <p>${selectedTopicId==='all' ? 'All topics (shuffled)' : topicById(selectedTopicId).name}</p>
        </div>
        <div class="score-pill">Score <b>${quizScore}</b> / ${quizIndex} · Question <b>${quizIndex+1}</b> of ${quizDeck.length}</div>
      </div>

      <div class="quiz-card">
        <span class="quiz-topic-tag">${q.topic}</span>
        <div class="quiz-stem">${q.stem}</div>
        <div class="quiz-options" id="optionsWrap">
          ${q.options.map((opt,i)=>`
            <button class="quiz-option" data-i="${i}">
              <span class="opt-letter">${letters[i]}</span><span>${opt}</span>
            </button>
          `).join('')}
        </div>
        <div class="explanation" id="explanationBox"></div>
        <div class="quiz-footer">
          <span class="progress-text" id="feedbackText"></span>
          <button class="btn primary" id="quizNextBtn" style="display:none;">${quizIndex===quizDeck.length-1 ? 'See results' : 'Next question →'}</button>
        </div>
      </div>
    `;
    document.querySelectorAll('.quiz-option').forEach(btn=>{
      btn.onclick = ()=> handleAnswer(parseInt(btn.dataset.i));
    });
  }

  function handleAnswer(selected){
    if(quizAnswered) return;
    quizAnswered = true;
    const q = quizDeck[quizIndex];
    const correct = selected === q.answer;
    if(correct) quizScore++;
    quizResults.push({topic:q.topic, correct});

    document.querySelectorAll('.quiz-option').forEach((btn,i)=>{
      btn.classList.add('disabled');
      if(i===q.answer) btn.classList.add('correct');
      else if(i===selected) btn.classList.add('incorrect');
      else btn.classList.add('dim');
    });

    const box = document.getElementById('explanationBox');
    box.className = 'explanation show ' + (correct ? 'correct-box':'incorrect-box');
    box.innerHTML = `<b>${correct ? '✓ Correct' : '✗ Not quite — correct answer: ' + String.fromCharCode(65+q.answer)}</b>${q.explanation}`;

    document.getElementById('feedbackText').textContent = correct ? 'Nice work.' : 'Review the explanation, then continue.';
    document.getElementById('quizNextBtn').style.display = 'inline-block';
    document.getElementById('quizNextBtn').onclick = ()=>{
      quizIndex++;
      quizAnswered = false;
      renderQuiz();
    };
  }

  function renderSummary(){
    const total = quizDeck.length;
    const pct = Math.round((quizScore/total)*100);
    // breakdown by topic
    const byTopic = {};
    quizResults.forEach(r=>{
      if(!byTopic[r.topic]) byTopic[r.topic] = {correct:0, total:0};
      byTopic[r.topic].total++;
      if(r.correct) byTopic[r.topic].correct++;
    });
    mainArea.innerHTML = `
      <div class="header-row">
        <div>
          <h1>Quiz Complete</h1>
          <p>${selectedTopicId==='all' ? 'All topics (shuffled)' : topicById(selectedTopicId).name}</p>
        </div>
      </div>
      <div class="summary-box">
        <div style="font-size:13px;color:var(--ink-soft);">Your score</div>
        <div class="big-score">${quizScore} / ${total}</div>
        <div style="color:var(--ink-soft);font-size:13px;">${pct}% correct</div>
        <div style="margin-top:20px;display:flex;gap:10px;justify-content:center;">
          <button class="btn primary" id="retryBtn">Retake this set</button>
          <button class="btn" id="shuffleRetryBtn">Retake (shuffled)</button>
        </div>
        <div class="summary-list">
          ${Object.keys(byTopic).map(k=>`
            <div class="summary-row"><span>${k}</span><span>${byTopic[k].correct}/${byTopic[k].total}</span></div>
          `).join('')}
        </div>
      </div>
    `;
    document.getElementById('retryBtn').onclick = ()=>{ setupQuizDeck(); renderQuiz(); };
    document.getElementById('shuffleRetryBtn').onclick = ()=>{ setupQuizDeck(); quizDeck = shuffle(quizDeck); renderQuiz(); };
  }

  function emptyState(msg){
    return `<div class="empty-state"><p>${msg}</p></div>`;
  }

  // ---------- Mode switching ----------
  modeFlashBtn.onclick = ()=>{
    mode='flash';
    modeFlashBtn.classList.add('active');
    modeQuizBtn.classList.remove('active');
    setupFlashDeck(); renderFlash(); buildSidebar();
  };
  modeQuizBtn.onclick = ()=>{
    mode='quiz';
    modeQuizBtn.classList.add('active');
    modeFlashBtn.classList.remove('active');
    setupQuizDeck(); renderQuiz(); buildSidebar();
  };

  // ---------- Init ----------
  buildSidebar();
  setupFlashDeck();
  renderFlash();
})();
</script>
</body>
</html>
